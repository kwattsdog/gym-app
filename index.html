<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Gym Tracker</title>
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{--bg:#0b1220;--card:#141c2e;--card2:#1b2540;--line:#26324f;--txt:#eef2fb;--mut:#93a0bd;--acc:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
#app{max-width:620px;margin:0 auto;padding:0 12px}
h1{font-size:26px;margin:4px 0 0}h2{font-size:19px;margin:0 0 8px}h3{font-size:19px;margin:0}
p{margin:6px 0}a{color:var(--acc)}
.muted{color:var(--mut)}.tiny{font-size:13px}.pad{padding:0 4px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 6px}
.who{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.who button{flex:1;border:0;border-radius:11px;background:none;color:var(--mut);font-size:18px;font-weight:700;padding:12px;min-height:48px}
.who button.on{background:var(--acc);color:#fff}
#nav[hidden]{display:none}
body.picking{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.picker{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.picker button{min-height:64px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:22px;font-weight:800}
.picker button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.picker button.add{background:transparent;color:var(--acc);font-size:18px;font-weight:700}
.phone-label{margin:0}
.days{display:flex;gap:6px;overflow-x:auto;padding:6px 0;margin:0 -2px}
.days button{position:relative;flex:1;min-width:44px;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:12px;min-height:48px;font-size:15px;font-weight:600}
.days button.today{border-color:var(--acc)}.days button.on{background:var(--acc);border-color:var(--acc)}
.days button i{position:absolute;top:1px;right:5px;font-size:11px;font-style:normal;color:var(--ok)}
.days button.on i{color:#fff}
.dayhead{padding:6px 2px}.focus{font-size:18px;font-weight:600;margin:2px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card.ok{border-color:var(--ok)}.card.rest{text-align:center}
.note,.warn{background:#2a2410;border:1px solid #5b4a12;color:#fde9a8;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.warn{background:#35161a;border-color:#7a2a33;color:#ffc9cf}
.prog{display:flex;align-items:center;gap:10px;margin:8px 2px}.bar{flex:1;height:10px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar div{height:100%;background:var(--ok);transition:width .25s}
.meta{margin:4px 0}.hint{background:#0f2a1c;border:1px solid #1f6b3e;border-radius:12px;padding:8px 10px;margin:8px 0;font-size:15px}
.sets{margin-top:8px}.set{display:grid;grid-template-columns:30px 1fr 1fr 64px;gap:8px;align-items:center;margin:6px 0}
.set.hdr{font-size:12px;color:var(--mut);margin:4px 0 0}
.set .n{color:var(--mut);font-weight:700;text-align:center}
input,textarea{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:18px;min-height:52px;font-family:inherit}
textarea{min-height:80px;margin:8px 0}
input[type=checkbox]{width:28px;height:28px;min-height:0;flex:none;accent-color:var(--ok)}
.set input{text-align:center;font-weight:600}
.chk{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--mut);font-size:26px;font-weight:800}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#06210f}
.set.done input{opacity:.6}
.plate-hint{color:#9ec5ff;min-height:0;margin-top:2px}.plate-hint:empty{display:none}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.mini{min-height:44px;padding:8px 12px;font-size:15px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:#ff9aa5;border-color:#7a2a33}
.btn.big{min-height:56px;font-size:20px}
.btn:disabled{opacity:.4}
.filebtn{cursor:pointer}
.swap{margin-top:8px}.alt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:16px}
.alt.on{border-color:var(--acc)}
.det{border-top:1px solid var(--line);margin-top:10px;padding-top:6px;font-size:15px;color:#cbd5ec}
.chkrow{display:flex;gap:12px;align-items:flex-start;padding:6px 0}.chkrow.sm{align-items:center;min-height:44px}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.rpe button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:19px;font-weight:700}
.rpe button.on{background:var(--acc);border-color:var(--acc)}
.card .btn.big{width:100%;margin-top:6px}
.water{display:flex;align-items:center;gap:14px;justify-content:space-between}.wnum{text-align:center;font-size:22px}.wnum b{font-size:40px}
.water .btn{width:84px}
.drops{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;font-size:24px}.drop{opacity:.25}.drop.f{opacity:1}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.scale button{min-height:64px;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;gap:2px}
.scale b{font-size:22px}.scale button.on{background:var(--acc);border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.two label,label{font-size:13px;color:var(--mut);display:block}
label input{margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stats.big{grid-template-columns:repeat(2,1fr)}
.stats div{background:var(--card2);border-radius:12px;padding:10px;text-align:center}.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--mut)}
.chart{width:100%;height:auto;margin:6px 0}.chart .grid{stroke:var(--line);stroke-width:1}.chart .ax{fill:var(--mut);font-size:10px}
.chart .goal{stroke:var(--ok);stroke-dasharray:5 4;stroke-width:1.5}.chart .gl{fill:var(--ok);font-size:10px}.chart .startl{stroke:var(--mut);stroke-dasharray:2 4}
.chart .ln{stroke:var(--acc);stroke-width:2.5}.chart .pt{fill:var(--acc)}
.list .li,.li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.good{color:var(--ok)}.bad{color:var(--warn)}
.x{background:none;border:0;color:var(--mut);font-size:18px;min-width:44px;min-height:44px}
.table .tr{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 1fr 40px;gap:4px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}.table .th{color:var(--mut);font-size:12px}
.table .x{min-width:0;min-height:36px;font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:3/4}.ph img{width:100%;height:100%;object-fit:cover}.ph span{position:absolute;bottom:0;left:0;right:0;background:#000a;font-size:12px;padding:2px}
.overlay{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}.overlay img{flex:1;min-height:0;object-fit:contain;width:100%}
.ov-bar{display:flex;gap:10px;align-items:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:#111}.ov-bar span{flex:1}
.wk{display:flex;align-items:center;justify-content:space-between}
.sec{margin:16px 4px 4px;font-size:18px}
.hist summary{cursor:pointer;list-style:none;min-height:44px}.hist .hx{padding:6px 0;border-top:1px solid var(--line);margin-top:6px;font-size:15px}.notes{font-style:italic;color:var(--mut)}
.spec{margin:8px 0;font-size:15px}.link{display:block;background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0;text-decoration:none;color:var(--txt)}
details summary{min-height:32px}
ol{padding-left:20px}
#timer{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:20;background:#0f1a33;border:1px solid var(--acc);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;overflow:hidden;max-width:604px;margin:0 auto;box-shadow:0 6px 20px #0008}
#timer[hidden]{display:none}#timer.go{background:#0f3a20;border-color:var(--ok)}
#tfill{position:absolute;left:0;bottom:0;height:4px;background:var(--acc);width:0}#tl{flex:1;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
#timer .btn{min-height:44px;padding:6px 12px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0e1628;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 1px;min-height:60px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button span{font-size:20px;line-height:1}#nav button.on{color:var(--acc)}
.rings{display:flex;justify-content:space-around;gap:8px;margin:4px 0}
.ring{width:46%;max-width:168px;height:auto}
.ringbg{fill:none;stroke:#24304a;stroke-width:8}
.ringfg{fill:none;stroke-width:8;stroke-linecap:round}
.ringv{fill:var(--txt);font-size:18px;font-weight:800}
.ringsub{fill:var(--mut);font-size:9px}
.ringcap{text-align:center;font-size:13px;color:var(--mut);margin-top:-4px}
.macrobar{display:flex;align-items:center;gap:8px;margin:8px 0}.macrobar span{font-size:13px;min-width:72px}.macrobar b{font-size:13px;min-width:72px;text-align:right}
.fswipe{position:relative;margin:8px 0;overflow:hidden;border-radius:12px}
.fdel{position:absolute;right:0;top:0;bottom:0;width:84px;border:0;background:var(--bad);color:#fff;font-weight:800}
.fcard{position:relative;z-index:1;background:var(--card2);border-radius:12px;padding:8px 8px 8px 12px;display:flex;gap:6px;align-items:center;touch-action:pan-y}
.fcard .nm{flex:1;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:4px 0;min-height:44px}
.fres{display:block;width:100%;text-align:left;background:var(--card2);border:0;color:inherit;border-radius:12px;padding:10px 12px;margin:6px 0;min-height:52px}
.fhit{display:flex;gap:6px;align-items:center}.fhit .fres{flex:1;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:999px;padding:8px 12px;min-height:40px;font-weight:700}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
#foodCam{width:100%;border-radius:12px;background:#000;max-height:280px;object-fit:cover}
.star{background:none;border:0;color:var(--warn);font-size:22px;min-width:44px;min-height:44px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:#1f2d52;border:1px solid var(--acc);padding:12px 16px;border-radius:14px;z-index:60;max-width:92%;transition:transform .25s;font-weight:600;text-align:center}
#toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}.confetti span{position:absolute;top:-40px;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){.bar div,#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer" hidden><div id="tfill"></div><span id="tl">Rest</span><button class="btn" data-act="timer-add">+15s</button><button class="btn" data-act="timer-skip">Skip</button></div>
<div id="toast" role="status"></div>
<nav id="nav"><button data-tab="workout"><span>🏋️</span>Workout</button><button data-tab="food"><span>🍽️</span>Food</button><button data-tab="daily"><span>💧</span>Daily</button><button data-tab="progress"><span>📈</span>Progress</button><button data-tab="history"><span>🗓️</span>History</button><button data-tab="more"><span>⚙️</span>More</button></nav>
<noscript>This app needs JavaScript.</noscript>
<script>
const PLANS={"Kevin":{"Mon":{"focus":"Push: chest, shoulders, triceps","minutes":"30–45 min","warmup":"5 min easy Peloton, then arm circles, wall slides or light face pulls, and 8–10 push-ups or a light Smith bench ramp-up. Set Smith safety spotters just below chest height before you work.","exercises":[{"id":"k-smith-bench","name":"Smith bench press","sets":4,"reps":"8–10","rest":90,"top":10,"station":"Smith bar + bench. Safety spotters just below the bottom of the press. Bar starting weight is 40 lb; log total weight including the bar.","cue":"Feet planted, slight arch, lower with control to mid-chest, don't bounce. Keep elbows about 45–70° from your torso if shoulders complain."},{"id":"k-db-ohp","name":"Dumbbell overhead press","sets":3,"reps":"10","rest":75,"top":10,"station":"Dumbbells (5–45 lb), seated on the bench with back support if you have it.","cue":"Press up, don't shrug. Stop short of pain in the shoulders. If 45s get easy, switch to a Smith standing or seated overhead press (bar goes up to about 78\")."},{"id":"k-inc-db","name":"Incline dumbbell press","sets":3,"reps":"10–12","rest":75,"top":12,"station":"Adjustable bench on a moderate incline + dumbbells, inside the rack or just in front.","cue":"Moderate incline only (not steeper than you need). Lower to the upper chest, press up without flaring elbows wide."},{"id":"k-fly-lat","name":"Cable fly or lateral raise","sets":3,"reps":"12–15","rest":60,"top":15,"station":"Fly: 2:1 functional-trainer trolleys at mid/high, D-handles. Laterals: dumbbells, or one cable at the low trolley. Log the stack pin number on cables (2:1 feels like half the pin weight).","cue":"Soft elbow, squeeze at the end, no swinging. Pick one variation and stick with it for a few weeks."},{"id":"k-pushdown","name":"Cable triceps pushdown","sets":3,"reps":"12","rest":60,"top":12,"station":"High pulley (2:1 trolley or 1:1 high tower) with the included tricep rope or aluminum tricep/curl bar.","cue":"Elbows stay by your sides. Finish with a straight arm and a controlled return."}],"finisher":"10 min Peloton HIIT (30 sec harder, 30 sec easy). Warm the first minute easy."},"Tue":{"focus":"Pull: back, biceps","minutes":"30–45 min","warmup":"5 min easy Peloton, then shoulder circles, cat-camel, and a light pulldown or row ramp-up. If doing pull-ups, do a couple of easy reps or use the assistance strap first.","exercises":[{"id":"k-pullup","name":"Pull-ups or lat pulldown","sets":4,"reps":"6–10","rest":90,"top":10,"station":"Pull-ups: multi-grip pull-up bar. Assistance: the included pull-up strap on a cable. Pulldown: 1:1 high towers (200 lb stack feels like about 230 lb) + lat seat + aluminum lat bar.","cue":"Chest up, pull elbows down toward your pockets, don't shrug into your ears. Prefer pulldowns if shoulders or elbows complain."},{"id":"k-cable-row","name":"Seated cable row","sets":3,"reps":"10–12","rest":75,"top":12,"station":"Low-row station with the included row foot plate and close-grip row attachment or D-handles. Stock low row is 2:1 (pin weight feels like half). A 1:1 low-pulley kit is optional and not assumed.","cue":"Sit tall, pull to the lower ribs, squeeze shoulder blades, then let the arms stretch forward without rounding the lower back."},{"id":"k-db-row","name":"One-arm dumbbell row","sets":3,"reps":"10/arm","rest":75,"top":10,"station":"Bench + dumbbells, one knee and hand on the bench.","cue":"Back flat, pull the bell to the hip, don't twist the torso. Log each arm."},{"id":"k-facepull","name":"Cable face pulls","sets":3,"reps":"15","rest":60,"top":15,"station":"2:1 functional trainer, high trolley, included tricep rope.","cue":"Pull to the face or upper chest, rotate the hands so the knuckles go back, and keep the neck relaxed. Great for shoulders at 55."},{"id":"k-curls","name":"Dumbbell curls","sets":3,"reps":"12","rest":60,"top":12,"station":"Dumbbells, or the aluminum curl bar on a low 2:1 trolley.","cue":"Elbows quiet at your sides, no swinging. Full lower, controlled lift."}],"finisher":"10 min easy-moderate Peloton ride."},"Wed":{"focus":"Legs and core","minutes":"30–45 min","warmup":"5 min easy Peloton, 10 bodyweight squats, 10 leg swings each side, and a few hip hinges. Set Smith safety spotters just below the bottom of your squat before you load the bar.","exercises":[{"id":"k-smith-squat","name":"Smith squat","sets":4,"reps":"8–10","rest":90,"top":10,"station":"Smith bar, safety spotters just below parallel (or your comfortable depth). Bar starting weight is 40 lb; log total weight including the bar.","cue":"Brace, sit back and down, keep heels down. Stop around parallel if knees or hips prefer it; don't bounce out of the bottom."},{"id":"k-rdl","name":"Dumbbell Romanian deadlift","sets":3,"reps":"10","rest":75,"top":10,"station":"Dumbbells. If 45s get easy, use the Smith bar for the same hinge (the bar travels down to about 11\", which is low enough for a good stretch).","cue":"Soft knees, push the hips back, keep the back flat, feel the hamstrings, then stand tall. Don't round or yank."},{"id":"k-lunge","name":"Reverse lunge or walking lunge","sets":3,"reps":"10/leg","rest":75,"top":10,"station":"Dumbbells on the floor. Reverse lunges are usually friendlier on the knees than walking lunges or Bulgarian split squats.","cue":"Long enough step that the front knee stays over the mid-foot. Drop the back knee under control. Use a bench-supported split squat if balance is off."},{"id":"k-leg-ext","name":"Leg extension","sets":3,"reps":"12–15","rest":60,"top":15,"station":"Bench leg extension/curl attachment (Blazzed's official option is the X4 bench attachment: seated extension). Not a rack-mounted station on the HD1-S.","cue":"Don't slam the top. Pause briefly, lower slowly. Reduce range if the knees complain."},{"id":"k-leg-curl","name":"Leg curl","sets":3,"reps":"12–15","rest":60,"top":15,"station":"Same bench attachment, prone (lying) curl.","cue":"Hips stay on the pad, curl heels toward the glutes, lower slowly."},{"id":"k-plank","name":"Plank","sets":3,"reps":"45 sec","rest":45,"top":45,"timed":true,"station":"Floor, mat if you have one.","cue":"Elbows under shoulders, ribs down, squeeze glutes. Drop to knees if form fades. Log seconds."},{"id":"k-crunch","name":"Cable crunch","sets":3,"reps":"15","rest":60,"top":15,"station":"High pulley with the rope, kneeling.","cue":"Round the ribs toward the hips; don't yank with the arms."}],"finisher":"Core work above is the finisher. Optional 5 min easy spin if you still feel cold or stiff."},"Thu":{"focus":"Push (variation)","minutes":"30–45 min","warmup":"5 min easy Peloton, arm circles, light band or cable face pulls, and a light Smith incline ramp-up. Set safety spotters under the bar path.","exercises":[{"id":"k-smith-inc","name":"Smith incline press","sets":4,"reps":"8–10","rest":90,"top":10,"station":"Smith bar + bench on a moderate incline, safety spotters set just below the bottom.","cue":"Same rules as flat bench: controlled lower, don't bounce, keep the neck relaxed."},{"id":"k-db-flat","name":"Dumbbell flat press","sets":3,"reps":"10","rest":75,"top":10,"station":"Flat bench + dumbbells.","cue":"Lower with control, press up without banging the bells together hard."},{"id":"k-arnold","name":"Arnold press","sets":3,"reps":"10","rest":75,"top":10,"station":"Dumbbells, seated.","cue":"Rotate as you press, stay in a comfortable range. Switch to a plain seated DB press if the rotation bothers a shoulder."},{"id":"k-laterals","name":"Lateral raises","sets":3,"reps":"15","rest":60,"top":15,"station":"Dumbbells, or a 2:1 low cable with a D-handle.","cue":"Lead with the elbows, stop around shoulder height, no swing."},{"id":"k-oh-tri","name":"Overhead dumbbell triceps extension","sets":3,"reps":"12","rest":60,"top":12,"station":"One or two dumbbells, seated, or a cable with the rope at a high or mid trolley.","cue":"Elbows point up, don't flare wide. Shorten the range if it pinches the elbows or shoulders."}],"finisher":"10 min Peloton ride, easy to moderate."},"Fri":{"focus":"Pull (variation)","minutes":"30–45 min","warmup":"5 min easy Peloton, then light pulldowns or rows and a few bodyweight hip hinges.","exercises":[{"id":"k-smith-row","name":"Smith bent-over row","sets":4,"reps":"8–10","rest":90,"top":10,"station":"Smith bar. Because the bar path is fixed, hinge and stay in a groove that doesn't round the back. Safety spotters can sit just below the stretch.","cue":"Soft knees, flat back, pull to the lower ribs, lower under control."},{"id":"k-cg-lat","name":"Close-grip lat pulldown","sets":3,"reps":"10–12","rest":75,"top":12,"station":"1:1 high towers + lat seat + close-grip row attachment or a close grip on the lat bar.","cue":"Pull to the upper chest, elbows in, no leaning way back."},{"id":"k-rear-delt","name":"Rear-delt dumbbell fly","sets":3,"reps":"15","rest":60,"top":15,"station":"Dumbbells, bent over or chest on a slightly incline bench. Cable face-pull style is a fine swap.","cue":"Soft elbows, squeeze the rear shoulders, don't yank with the lower back."},{"id":"k-hammer","name":"Hammer curls","sets":3,"reps":"12","rest":60,"top":12,"station":"Dumbbells, neutral grip.","cue":"Thumbs up, elbows still, controlled lower."},{"id":"k-shrugs","name":"Smith shrugs","sets":3,"reps":"12","rest":60,"top":12,"station":"Smith bar, standing, walk-under height is 73.25\".","cue":"Straight up and down, pause at the top, don't roll the shoulders."}],"finisher":"10 min Peloton HIIT (30 sec harder, 30 sec easy)."},"Sat":{"focus":"Legs and conditioning","minutes":"30–45 min","warmup":"5 min easy Peloton, 10 bodyweight squats, 10 leg swings each side, and a couple of bodyweight hip thrusts or glute bridges.","exercises":[{"id":"k-split-squat","name":"Smith split squat","sets":3,"reps":"10/leg","rest":75,"top":10,"station":"Smith bar, safety spotters set just below the bottom. Back foot can rest lightly on the floor, or on the bench if you like a Bulgarian stance and your hips allow it.","cue":"Front heel down, drop the back knee, stay tall. Reverse lunges with dumbbells are the swap if the Smith stance feels awkward."},{"id":"k-hip-thrust","name":"Smith hip thrust","sets":3,"reps":"10–12","rest":75,"top":12,"station":"Smith bar (low starting height is about 11\", which is what this movement needs) + bench for upper-back support. Pad the bar if you have a pad or towel.","cue":"Chin tucked, ribs down, drive through the heels, squeeze at the top without over-arching the lower back."},{"id":"k-goblet","name":"Goblet squat","sets":3,"reps":"12","rest":60,"top":12,"station":"One dumbbell held at the chest. If 45 lb is easy, use a lighter Smith squat or slower tempo.","cue":"Elbows inside the knees if you can, heels down, controlled depth."},{"id":"k-calf","name":"Smith calf raise","sets":3,"reps":"15","rest":45,"top":15,"station":"Smith bar, standing. A sturdy plate or small step under the balls of the feet helps if you have one; otherwise use the floor.","cue":"Pause at the top, lower slowly through a comfortable stretch. Don't bounce."}],"finisher":"20 min Peloton endurance or climb ride, conversational pace — this is conditioning, not an all-out race."},"Sun":{"focus":"Rest day","minutes":"Easy movement only","warmup":"None required. A walk or an easy Peloton spin is fine if you want to move.","exercises":[],"finisher":"Sleep, protein, and a walk if you feel like it."}},"Sasha":{"Mon":{"focus":"Upper push: strength and bone loading","minutes":"30–45 min","warmup":"5 min easy Peloton, arm circles, wall slides or light face pulls, and a very light Smith or dumbbell press ramp-up. Set Smith safety spotters before you start.","exercises":[{"id":"s-smith-bench","name":"Smith bench press","sets":3,"reps":"8–12","rest":75,"top":12,"station":"Smith bar + bench, safety spotters just below chest height. Bar starts at 40 lb; that's a good first work weight until the movement feels smooth. Log total weight including the bar.","cue":"Lower with control, press up without bouncing. Leave 2–3 reps in reserve. The guided bar is there so you can learn pressing safely."},{"id":"s-db-press","name":"Seated dumbbell press","sets":3,"reps":"8–12","rest":75,"top":12,"station":"Dumbbells, seated on the bench.","cue":"Press up, don't shrug. Use a range that doesn't pinch the shoulders."},{"id":"s-cable-fly","name":"Cable chest fly","sets":2,"reps":"12–15","rest":60,"top":15,"station":"2:1 functional-trainer trolleys at mid height, D-handles. Log the stack pin number.","cue":"Soft elbows, hug in, slow return. Light is fine."},{"id":"s-laterals","name":"Lateral raises","sets":2,"reps":"12–15","rest":45,"top":15,"station":"Light dumbbells or a low 2:1 cable.","cue":"Stop around shoulder height, no swinging."},{"id":"s-pushdown","name":"Cable triceps pushdown","sets":2,"reps":"12–15","rest":45,"top":15,"station":"High pulley with the tricep rope or tricep/curl bar.","cue":"Elbows by your sides, squeeze at the bottom."}],"finisher":"8–10 min easy to moderate Peloton ride, not all-out."},"Tue":{"focus":"Upper pull and posture","minutes":"30–45 min","warmup":"5 min easy Peloton, shoulder circles, and a light pulldown ramp-up.","exercises":[{"id":"s-pulldown","name":"Lat pulldown or assisted pull-up","sets":3,"reps":"8–12","rest":75,"top":12,"station":"Preferred: 1:1 high towers + lat seat + lat bar (heavier, straight overhead). Or use the included pull-up strap for assisted pull-ups on the multi-grip bar.","cue":"Chest up, pull elbows down, don't shrug. Pulldowns are the default if pull-ups are new."},{"id":"s-row","name":"Seated cable row","sets":3,"reps":"10–12","rest":75,"top":12,"station":"Low-row station, row foot plate, close-grip attachment or D-handles. Stock low row is 2:1.","cue":"Sit tall, pull to the lower ribs, pause, then stretch forward without rounding."},{"id":"s-facepull","name":"Cable face pulls","sets":3,"reps":"12–15","rest":45,"top":15,"station":"2:1 high trolley + rope.","cue":"Pull to the face, open the hands back, keep the neck relaxed. Excellent for shoulders and posture."},{"id":"s-curls","name":"Dumbbell or cable curls","sets":2,"reps":"12–15","rest":45,"top":15,"station":"Dumbbells, or the curl bar on a low trolley.","cue":"No swinging. Slow lower."}],"finisher":"8–10 min easy to moderate Peloton ride."},"Wed":{"focus":"Lower body, bone health, and core","minutes":"30–45 min","warmup":"5 min easy Peloton, 10 sit-to-stands or bodyweight squats, 10 leg swings each side, and a few hip hinges. Set Smith safety spotters before you squat.","exercises":[{"id":"s-squat","name":"Smith squat or goblet squat","sets":3,"reps":"8–12","rest":75,"top":12,"station":"Start with a goblet squat (one dumbbell) if the Smith is new, then move to the Smith bar with safety spotters just below your depth. Bar starts at 40 lb.","cue":"Heels down, sit back and down to a comfortable depth (around parallel is plenty). Brace, don't bounce. Squats are a main bone-loading lift."},{"id":"s-rdl","name":"Dumbbell Romanian deadlift","sets":3,"reps":"8–12","rest":75,"top":12,"station":"Dumbbells. Smith RDL is the swap if you want a guided hinge.","cue":"Soft knees, hips back, back flat, stand tall. This hip hinge is also a bone-loading lift."},{"id":"s-leg-ext","name":"Leg extension","sets":2,"reps":"12–15","rest":45,"top":15,"station":"Bench leg extension/curl attachment, seated.","cue":"Controlled, no slam at the top. Shorten the range if knees complain."},{"id":"s-leg-curl","name":"Leg curl","sets":2,"reps":"12–15","rest":45,"top":15,"station":"Same attachment, prone curl.","cue":"Hips on the pad, slow lower."},{"id":"s-calf","name":"Calf raise","sets":2,"reps":"12–15","rest":45,"top":15,"station":"Smith bar or bodyweight on the floor.","cue":"Pause at the top, lower slowly."},{"id":"s-core","name":"Side plank or Pallof press","sets":3,"reps":"20–30 sec or 8–10/side","rest":45,"top":8,"station":"Floor for side planks, or a 2:1 mid pulley with a D-handle for a standing Pallof press (anti-rotation).","cue":"Stay tall, don't hold you     if(W>45)return 'Dumbbells top out at 45 lb. Slow the tempo, add reps, or switch to the Smith or a cable.';

function blankFoodDay(){return {breakfast:[],lunch:[],dinner:[],snacks:[]};}
function migrateFood(o){
  let changed=false;
  if(!o.foodDays||typeof o.foodDays!=='object'){o.foodDays={};changed=true;}
  if(!o.foodLib||typeof o.foodLib!=='object'){o.foodLib={};changed=true;}
  if(!o.foodTargets||typeof o.foodTargets!=='object'){o.foodTargets={};changed=true;}
  Object.keys(o.daily||{}).forEach(k=>{
    const d=o.daily[k];if(!d||typeof d!=='object')return;
    const hasCal=d.cal!=null&&d.cal!=='',hasPro=d.protein!=null&&d.protein!=='';
    if(!hasCal&&!hasPro)return;
    if(!o.foodDays[k]||typeof o.foodDays[k]!=='object')o.foodDays[k]=blankFoodDay();
    MEALS.forEach(m=>{if(!Array.isArray(o.foodDays[k][m[0]]))o.foodDays[k][m[0]]=[];});
    const items=MEALS.reduce((a,m)=>a.concat(o.foodDays[k][m[0]]),[]);
    if(!items.some(it=>it&&(it.migrated||it.id==='mig-'+k))){
      const cal=num(d.cal),prot=num(d.protein);
      o.foodDays[k].snacks.push({id:'mig-'+k,migrated:true,foodId:'quick:earlier',name:'Earlier log',brand:'',barcode:'',meal:'snacks',qty:1,unit:'serving',kcal:isNaN(cal)?0:cal,p:isNaN(prot)?0:prot,c:0,f:0,per100:null,perUnit:{kcal:isNaN(cal)?0:cal,p:isNaN(prot)?0:prot,c:0,f:0},servings:[{unit:'serving',grams:null,label:'serving'}],source:'quick'});
      changed=true;
    }
    delete d.cal;delete d.protein;changed=true;
  });
  return changed;
}

  if(food.per100){

    if(!isNaN(sq)&&sq>0)food.servings.push({unit:'serving',grams:sq,label:p.serving_size||'serving'});

function intakeChart(series,key,target,label){

async function runFoodSearch(q){
  const box=$('#foodResults');if(!box)return;
  const local=searchLocal(q);
  local.forEach(f=>{FOOD_BY_ID[f.id]=f;});
  if(!String(q||'').trim()){
    const L=foodLib(ui.person);
    box.innerHTML=(L.fav.length?'<p class="tiny muted">Favorites</p>'+L.fav.slice(0,12).map(f=>{FOOD_BY_ID[f.id]=f;return hitButton(f);}).join(''):'')+
      (L.recent.length?'<p class="tiny muted">Recent</p>'+L.recent.slice(0,12).map(f=>{FOOD_BY_ID[f.id]=f;return hitButton(f);}).join(''):'')+
      (!L.fav.length&&!L.recent.length?'<p class="muted">Search a food, scan a barcode, or quick add.</p>':'');
    return;
  }
  box.innerHTML=renderHits(local,[],'searching');
  if(foodAbort)foodAbort.abort();
  if(String(q).trim().length<2){box.innerHTML=renderHits(local,[], '');return;}
  const ac=new AbortController();foodAbort=ac;
  try{
    const url='https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(String(q).trim())+'&search_simple=1&action=process&json=1&page_size=20&fields=code,product_name,brands,nutriments,serving_size,serving_quantity,generic_name';
    const res=await fetch(url,{signal:ac.signal});
    if(!res.ok)throw new Error('off');
    const data=await res.json();
    if(ui.foodQ!==q||!$('#foodResults'))return;
    const off=(data.products||[]).map(offToFood).filter(Boolean).filter(f=>!local.some(l=>l.id===f.id)).slice(0,20);
    $('#foodResults').innerHTML=renderHits(local,off,'');
  }catch(e){
    if(e&&e.name==='AbortError')return;
    if($('#foodResults')&&ui.foodQ===q)$('#foodResults').innerHTML=renderHits(local,[],'offline');
  }
}

async function lookupBarcode(code){

  const local=foodByBarcode(code);
  if(local){toast('Found on this phone');openPick(local);return;}
  toast('Looking up '+code+'…');
  try{
    const res=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=code,product_name,product_name_en,generic_name,brands,nutriments,serving_size,serving_quantity');
    const data=await res.json();
    if(!data||data.status!==1||!data.product){toast('Not in Open Food Facts. Add it yourself.');openManual(code);return;}
    const food=offToFood(data.product);

  return new Promise((res,rej)=>{const s=document.createElement('script');s.src=ZXING_URL;s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error('zxing'));document.head.appendChild(s);});

async function startScan(){
  if(scanOn||ui.foodMode!=='scan')return;
  const video=$('#foodCam'),msg=$('#camMsg');if(!video)return;
  scanOn=true;
  const onCode=text=>{if(!scanOn)return;scanOn=false;stopScan();lookupBarcode(text);};
  try{
    if(window.BarcodeDetector){
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      ui.scanStream=stream;video.srcObject=stream;await video.play();
      if(msg)msg.textContent='Looking for a barcode…';
      const tick=async()=>{if(!scanOn)return;try{const codes=await det.detect(video);if(codes&&codes[0]){onCode(codes[0].rawValue);return;}}catch(e){}
        if(scanOn)requestAnimationFrame(()=>tick());};
      tick();return;
    }
  }catch(e){/* fall through to ZXing or the typed code */}
  try{
    await loadZXing();
    const Reader=window.ZXing&&window.ZXing.BrowserMultiFormatReader;
    if(!Reader)throw new Error('no reader');
    const reader=new Reader();ui.zxingReader=reader;
    if(msg)msg.textContent='Looking for a barcode…';
    await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'},audio:false}},video,(result)=>{if(result&&scanOn)onCode(result.getText());});
  }catch(e){
    scanOn=false;
    if(msg)msg.textContent='Camera isn\u2019t available. Allow camera access if your iPhone asks, or type the barcode below. The scanner also needs the decoder saved on this phone (it downloads once).';
  }
}

function overload(ex,last){
  const L=last.slice(0,ex.sets);if(L.length<ex.sets||!ex.top)return null;
  if(!L.every(s=>num(s.r)>=ex.top))return null;
  if(ex.timed)return {text:'You hit '+ex.top+' sec on every set. Next time add 5-10 seconds.'};
  const w=num(L[0].w);
  if(isNaN(w)||w<=0)return {text:'You hit the top of the range on every set. Next time add 1-2 reps or make it harder.'};
  return {w:w+5,text:'You hit the top of the range ('+ex.reps+') on every set at '+w+' lb. Try '+(w+5)+' lb (+5 lb) today.'};
}

function weightChart(wi,start,goal){
  if(!wi.length)return '<p class="muted">Log a weigh-in to see your chart.</p>';
  const W=340,H=210,L=38,R=12,T=14,B=26;
  const vals=wi.map(x=>x.lbs);if(!isNaN(goal))vals.push(goal);if(!isNaN(start))vals.push(start);
  let mn=Math.min.apply(null,vals)-3,mx=Math.max.apply(null,vals)+3;if(mx-mn<8){mx+=4;mn-=4;}
  const t0=dUTC(wi[0].date).getTime(),t1=dUTC(wi[wi.length-1].date).getTime();
  const X=d=>t1===t0?L+(W-L-R)/2:L+(W-L-R)*(dUTC(d).getTime()-t0)/(t1-t0),Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Body weight chart">';
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="grid"/><text x="'+(L-5)+'" y="'+(y+4)+'" text-anchor="end" class="ax">'+Math.round(v)+'</text>';}
  if(!isNaN(goal))s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(goal)+'" y2="'+Y(goal)+'" class="goal"/><text x="'+(W-R)+'" y="'+(Y(goal)-4)+'" text-anchor="end" class="gl">Goal '+goal+'</text>';
  if(!isNaN(start)&&start!==goal)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(start)+'" y2="'+Y(start)+'" class="startl"/><text x="'+L+'" y="'+(Y(start)-4)+'" class="ax">Start '+start+'</text>';
  s+='<polyline class="ln" fill="none" points="'+wi.map(x=>X(x.date).toFixed(1)+','+Y(x.lbs).toFixed(1)).join(' ')+'"/>';
  wi.forEach(x=>{s+='<circle cx="'+X(x.date).toFixed(1)+'" cy="'+Y(x.lbs).toFixed(1)+'" r="4" class="pt"/>';});
  s+='<text x="'+L+'" y="'+(H-6)+'" class="ax">'+fmtShort(wi[0].date)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" class="ax">'+fmtShort(wi[wi.length-1].date)+'</text></svg>';
  return s;
}

/* ---- history + weekly summary ---- */
function weekStats(p,ws){
  const we=addDays(ws,6),ss=sessionsOf(p).filter(s=>s.date>=ws&&s.date<=we);
  const vol=ss.reduce((a,s)=>a+(s.volume||0),0),sets=ss.reduce((a,s)=>a+(s.setCount||0),0),rp=ss.filter(s=>s.rpe).map(s=>s.rpe);
  const days=[];for(let i=0;i<7;i++){const d=store.daily[dk(p,addDays(ws,i))];if(d)days.push(d);}
  const avg=f=>{const v=days.map(d=>num(d[f])).filter(x=>!isNaN(x)&&x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:NaN;};
  const cals=[],prots=[];
  for(let i=0;i<7;i++){const ft=foodTotals(p,addDays(ws,i));if(ft.n){cals.push(ft.kcal);prots.push(ft.p);}}
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
  const wi=store.weighIns[p].slice().sort((a,b)=>a.date<b.date?-1:1);
  const inWk=wi.filter(x=>x.date>=ws&&x.date<=we),before=wi.filter(x=>x.date<ws);
  let wc=NaN;if(inWk.length&&(before.length||inWk.length>1)){const ref=before.length?before[before.length-1].lbs:inWk[0].lbs;wc=inWk[inWk.length-1].lbs-ref;}
  return {n:ss.length,vol,sets,rpe:rp.length?rp.reduce((a,b)=>a+b,0)/rp.length:NaN,cal:mean(cals),protein:mean(prots),water:avg('water'),sleep:avg('sleep'),energy:avg('energy'),wc,prs:ss.reduce((a,s)=>a+((s.prs||[]).length),0)};
}

/* ---------- photos (IndexedDB) ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('hd1s-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function idbAll(){return idb().then(db=>new Promise((res,rej)=>{const q=db.transaction('p').objectStore('p').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}));}
function idbPut(o){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('p','readwrite');t.objectStore('p').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error);}));}
function idbDel(id){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error);}));}
let photoCache=[];
async function loadPhotos(){
  const g=$('#photoGrid');if(!g)return;
  try{photoCache=(await idbAll()).filter(x=>x.person===ui.person).sort((a,b)=>a.date<b.date?1:-1);}catch(e){g.innerHTML='<p class="muted">Photos aren\u2019t available in this browser.</p>';return;}
  const gg=$('#photoGrid');if(!gg)return;
  gg.innerHTML=photoCache.length?photoCache.map(x=>'<button class="ph" data-act="viewphoto" data-id="'+esc(x.id)+'"><img src="'+x.data+'" alt=""><span>'+fmtShort(x.date)+'</span></button>').join(''):'<p class="muted">No photos yet.</p>';
}
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.8));};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};im.src=url;});}

function checkPR(person,d,key,s){
  const sc=score(s.w,s.r);if(sc<=0)return;
  const prior=bestScore(person,key),seen=d.pr[key]||0;
  if(prior>0&&sc>Math.max(prior,seen)+1e-9){
    const ex=planOf(person,ui.day).exercises.find(e=>exData(e,d).key===key),name=ex?exData(ex,d).name:key;
    if(d.prNames.indexOf(name)<0)d.prNames.push(name);
    confetti();toast('🏆 New PR! '+name+': '+(num(s.w)>0?s.w+' lb × '+s.r:s.r+' reps'),4200);
  }
  if(sc>seen)d.pr[key]=sc;save();
}

  const P=ui.person,day=ui.day,plan=planOf(P,day),d=getDraft(P,day);
  const exs=[];let setCount=0,vol=0;
  plan.exercises.forEach(ex=>{const x=exData(ex,d),sets=(d.sets[x.key]||[]).filter(s=>s.d).map(s=>({w:s.w,r:s.r}));
    if(sets.length){exs.push({key:x.key,name:x.name,swapOf:x.swapOf,sets});setCount+=sets.length;vol+=volOf(sets);}});
  if(!exs.length){toast('Check off at least one set first');return;}
  const total=Object.values(d.sets).reduce((a,x)=>a+x.length,0),done=setCount;
  if(done<total&&!confirm('You completed '+done+' of '+total+' sets. Save this workout anyway?'))return;
  const id=P+'|'+d.date+'|'+day;
  store.sessions[id]={id,person:P,date:d.date,day,focus:plan.focus,finishedAt:new Date().toISOString(),rpe:d.rpe,notes:d.notes||'',warm:!!d.warm,cool:Object.values(d.cool).filter(Boolean).length,exercises:exs,setCount,volume:vol,prs:d.prNames.slice()};
  delete store.drafts[dk(P,day)];save();timer=null;tick();
  ui.saved={person:P,key:id};ui.swapOpen=null;render();toast('Workout saved. Nice work!');
}

/* ---------- export / import ---------- */
function currentPerson(){return getDevice()||ui.person;}
function exportObj(){
  const p=currentPerson();
  const o={v:store.v||1,app:'hd1s-workout-tracker',exportedAt:new Date().toISOString(),lastPerson:p,
    goals:{},weighIns:{},measures:{},daily:{},sessions:{},drafts:{},
    settings:JSON.parse(JSON.stringify(store.settings||blank().settings)),lastBackup:store.lastBackup||null,
    extraPeople:[],planFor:{},foodDays:{},foodLib:{},foodTargets:{}};
  o.goals[p]=JSON.parse(JSON.stringify(store.goals[p]||{start:'',goal:''}));
  o.weighIns[p]=JSON.parse(JSON.stringify(store.weighIns[p]||[]));
  o.measures[p]=JSON.parse(JSON.stringify(store.measures[p]||[]));
  Object.keys(store.sessions||{}).forEach(k=>{const s=store.sessions[k];if(s&&s.person===p)o.sessions[k]=JSON.parse(JSON.stringify(s));});
  Object.keys(store.daily||{}).forEach(k=>{if(k.indexOf(p+'|')===0)o.daily[k]=JSON.parse(JSON.stringify(store.daily[k]));});
  Object.keys(store.drafts||{}).forEach(k=>{if(k.indexOf(p+'|')===0)o.drafts[k]=JSON.parse(JSON.stringify(store.drafts[k]));});
  Object.keys(store.foodDays||{}).forEach(k=>{if(k.indexOf(p+'|')===0)o.foodDays[k]=JSON.parse(JSON.stringify(store.foodDays[k]));});
  if(store.foodLib&&store.foodLib[p])o.foodLib[p]=JSON.parse(JSON.stringify(store.foodLib[p]));
  if(store.foodTargets&&store.foodTargets[p])o.foodTargets[p]=JSON.parse(JSON.stringify(store.foodTargets[p]));
  if((store.extraPeople||[]).indexOf(p)>=0){o.extraPeople=[p];if(store.planFor&&store.planFor[p])o.planFor[p]=store.planFor[p];}
  return o;
}
function peopleIn(inc){
  const set=[],add=n=>{if(n&&set.indexOf(n)<0)set.push(n);};
  Object.keys(inc.sessions||{}).forEach(k=>{const s=inc.sessions[k];if(s&&s.person)add(s.person);});
  Object.keys(inc.weighIns||{}).forEach(n=>{if((inc.weighIns[n]||[]).length)add(n);});
  Object.keys(inc.measures||{}).forEach(n=>{if((inc.measures[n]||[]).length)add(n);});
  Object.keys(inc.daily||{}).forEach(k=>{const n=String(k).split('|')[0],d=inc.daily[k];if(n&&d&&Object.keys(d).some(f=>d[f]!=null&&d[f]!==''&&d[f]!==0))add(n);});
  Object.keys(inc.goals||{}).forEach(n=>{
    const g=inc.goals[n]||{},def=(blank().goals[n])||{start:'',goal:''};
    if((g.start||'')!==(def.start||'')||(g.goal||'')!==(def.goal||''))add(n);
  });
  Object.keys(inc.drafts||{}).forEach(k=>{const n=String(k).split('|')[0];if(n&&draftTouched(inc.drafts[k]))add(n);});
  Object.keys(inc.foodDays||{}).forEach(k=>{const n=String(k).split('|')[0];if(n&&dayHasFood(inc.foodDays[k]))add(n);});
  return set;
}
function clearPerson(p){
  Object.keys(store.sessions||{}).forEach(k=>{if(store.sessions[k]&&store.sessions[k].person===p)delete store.sessions[k];});
  Object.keys(store.daily||{}).forEach(k=>{if(k.indexOf(p+'|')===0)delete store.daily[k];});
  Object.keys(store.drafts||{}).forEach(k=>{if(k.indexOf(p+'|')===0)delete store.drafts[k];});
  store.weighIns[p]=[];store.measures[p]=[];store.goals[p]={start:'',goal:''};
  Object.keys(store.foodDays||{}).forEach(k=>{if(k.indexOf(p+'|')===0)delete store.foodDays[k];});
  if(store.foodLib)delete store.foodLib[p];
  if(store.foodTargets)delete store.foodTargets[p];
}
function remapPerson(inc,from,to){
  const sessions={},daily={},drafts={};
  Object.keys(inc.sessions||{}).forEach(k=>{
    const s=inc.sessions[k];if(!s||s.person!==from)return;
    const copy=JSON.parse(JSON.stringify(s));copy.person=to;
    const id=copy.date?to+'|'+copy.date+'|'+(copy.day||''):String(k).replace(/^[^|]+/,to);
    copy.id=id;sessions[id]=copy;
  });
  Object.keys(inc.daily||{}).forEach(k=>{if(k.indexOf(from+'|')===0)daily[to+'|'+k.slice(from.length+1)]=JSON.parse(JSON.stringify(inc.daily[k]));});
  Object.keys(inc.drafts||{}).forEach(k=>{if(k.indexOf(from+'|')===0)drafts[to+'|'+k.slice(from.length+1)]=JSON.parse(JSON.stringify(inc.drafts[k]));});
  const foodDays={};
  Object.keys(inc.foodDays||{}).forEach(k=>{if(k.indexOf(from+'|')===0)foodDays[to+'|'+k.slice(from.length+1)]=JSON.parse(JSON.stringify(inc.foodDays[k]));});
  return {sessions,daily,drafts,foodDays,foodLib:inc.foodLib&&inc.foodLib[from]?{[to]:JSON.parse(JSON.stringify(inc.foodLib[from]))}:{},foodTargets:inc.foodTargets&&inc.foodTargets[from]?{[to]:JSON.parse(JSON.stringify(inc.foodTargets[from]))}:{},
    goals:JSON.parse(JSON.stringify(inc.goals[from]||{start:'',goal:''})),
    weighIns:JSON.parse(JSON.stringify(inc.weighIns[from]||[])),
    measures:JSON.parse(JSON.stringify(inc.measures[from]||[]))};
}
function mergePerson(p,data){
  ensurePerson(p);
  Object.keys(data.sessions||{}).forEach(k=>{
    const b=data.sessions[k];if(!b||b.person!==p)return;
    const a=store.sessions[k];
    if(!a||String(b.finishedAt||'')>String(a.finishedAt||''))store.sessions[k]=b;
  });
  const m=new Map();(store.weighIns[p]||[]).forEach(x=>m.set(x.date,x));(data.weighIns||[]).forEach(x=>m.set(x.date,x));store.weighIns[p]=[...m.values()];
  const mm=new Map();(store.measures[p]||[]).forEach(x=>mm.set(x.date,x));(data.measures||[]).forEach(x=>mm.set(x.date,Object.assign({},mm.get(x.date),x)));store.measures[p]=[...mm.values()];
  const g=data.goals||{};
  ['start','goal'].forEach(f=>{if(!store.goals[p][f]&&g[f])store.goals[p][f]=g[f];});
  Object.keys(data.daily||{}).forEach(k=>{if(k.indexOf(p+'|')===0)store.daily[k]=Object.assign({},data.daily[k],store.daily[k]||{});});
  Object.keys(data.drafts||{}).forEach(k=>{if(k.indexOf(p+'|')===0&&!store.drafts[k])store.drafts[k]=data.drafts[k];});
  if(!store.foodDays||typeof store.foodDays!=='object')store.foodDays={};
  Object.keys(data.foodDays||{}).forEach(k=>{
    if(k.indexOf(p+'|')!==0)return;
    if(!store.foodDays[k])store.foodDays[k]=blankFoodDay();
    MEALS.forEach(m=>{
      if(!Array.isArray(store.foodDays[k][m[0]]))store.foodDays[k][m[0]]=[];
      const have={};store.foodDays[k][m[0]].forEach(it=>{if(it&&it.id)have[it.id]=1;});
      ((data.foodDays[k]&&data.foodDays[k][m[0]])||[]).forEach(it=>{if(it&&!have[it.id])store.foodDays[k][m[0]].push(it);});
    });
  });
  if(data.foodLib&&data.foodLib[p]){
    const L=foodLib(p),inc=data.foodLib[p];
    ['fav','custom','recent'].forEach(key=>{(inc[key]||[]).forEach(f=>{if(f&&f.id&&!L[key].some(x=>x.id===f.id))L[key].push(f);});});
  }
  if(data.foodTargets&&data.foodTargets[p])store.foodTargets[p]=Object.assign({},store.foodTargets[p]||{},data.foodTargets[p]);
}
async function doExport(){
  const txt=JSON.stringify(exportObj(),null,1),name='gym-backup-'+String(currentPerson()).replace(/\s+/g,'-')+'-'+nowDenver().date+'.json';
  const file=new File([txt],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Gym backup'});store.lastBackup=new Date().toISOString();save();render(true);toast('Backup shared');return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  store.lastBackup=new Date().toISOString();save();render(true);toast('Backup downloaded');
}
function doImport(txt,replace){
  let o;try{o=JSON.parse(txt);}catch(e){toast('That doesn\u2019t look like a backup file');return;}
  if(!o||typeof o!=='object'||(!o.sessions&&!o.weighIns&&!o.daily)){toast('That doesn\u2019t look like a backup file');return;}
  const inc=normalize(o);
  migrateFood(inc);
  const me=currentPerson();
  ensurePerson(me);
  const incoming=peopleIn(inc);
  let data;
  if(incoming.indexOf(me)>=0){
    data={sessions:{},daily:{},drafts:{},foodDays:{},foodLib:{},foodTargets:{},goals:inc.goals[me]||{start:'',goal:''},weighIns:inc.weighIns[me]||[],measures:inc.measures[me]||[]};
    Object.keys(inc.sessions||{}).forEach(k=>{const s=inc.sessions[k];if(s&&s.person===me)data.sessions[k]=s;});
    Object.keys(inc.daily||{}).forEach(k=>{if(k.indexOf(me+'|')===0)data.daily[k]=inc.daily[k];});
    Object.keys(inc.drafts||{}).forEach(k=>{if(k.indexOf(me+'|')===0)data.drafts[k]=inc.drafts[k];});
    Object.keys(inc.foodDays||{}).forEach(k=>{if(k.indexOf(me+'|')===0)data.foodDays[k]=inc.foodDays[k];});
    if(inc.foodLib&&inc.foodLib[me])data.foodLib[me]=inc.foodLib[me];
    if(inc.foodTargets&&inc.foodTargets[me])data.foodTargets[me]=inc.foodTargets[me];
  }else if(incoming.length===1){
    const from=incoming[0];
    if(!confirm('This backup is for '+from+', not '+me+'. Import it into '+me+' on this phone?'))return;
    data=remapPerson(inc,from,me);
  }else{
    toast(incoming.length?'That backup has more than one other person. Export one profile, or switch to the matching phone profile.':'That backup has no profile data');
    return;
  }
  if(replace){
    if(!confirm('Replace '+me+'\'s data on this phone with this backup? Other people\'s saved data stays on this phone.'))return;
    clearPerson(me);
    if(inc.settings)store.settings=Object.assign(blank().settings,inc.settings);
  }
  mergePerson(me,data);
  save();render(true);
  toast(incoming.indexOf(me)>=0&&incoming.length>1?'Imported '+me+' only':'Backup imported');
}

/* ---------- boot ---------- */
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b){ui.tab=b.dataset.tab;render();}});
window.__app={get store(){return store;},ui,render,act,doImport,exportObj,finish,weekStats,plateHint,SWAP_CAT,SWAP_LIB,getDevice,allPeople,peopleIn,LOCAL_FOODS,foodTotals,searchLocal};
render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
})();
