<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Gym Tracker</title>
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{--bg:#0b1220;--card:#141c2e;--card2:#1b2540;--line:#26324f;--txt:#eef2fb;--mut:#93a0bd;--acc:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
#app{max-width:620px;margin:0 auto;padding:0 12px}
h1{font-size:26px;margin:4px 0 0}h2{font-size:19px;margin:0 0 8px}h3{font-size:19px;margin:0}
p{margin:6px 0}a{color:var(--acc)}
.muted{color:var(--mut)}.tiny{font-size:13px}.pad{padding:0 4px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 6px}
.who{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.who button{flex:1;border:0;border-radius:11px;background:none;color:var(--mut);font-size:18px;font-weight:700;padding:12px;min-height:48px}
.who button.on{background:var(--acc);color:#fff}
#nav[hidden]{display:none}
body.picking{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.picker{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.picker button{min-height:64px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:22px;font-weight:800}
.picker button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.picker button.add{background:transparent;color:var(--acc);font-size:18px;font-weight:700}
.phone-label{margin:0}
.days{display:flex;gap:6px;overflow-x:auto;padding:6px 0;margin:0 -2px}
.days button{position:relative;flex:1;min-width:44px;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:12px;min-height:48px;font-size:15px;font-weight:600}
.days button.today{border-color:var(--acc)}.days button.on{background:var(--acc);border-color:var(--acc)}
.days button i{position:absolute;top:1px;right:5px;font-size:11px;font-style:normal;color:var(--ok)}
.days button.on i{color:#fff}
.dayhead{padding:6px 2px}.focus{font-size:18px;font-weight:600;margin:2px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card.ok{border-color:var(--ok)}.card.rest{text-align:center}
.note,.warn{background:#2a2410;border:1px solid #5b4a12;color:#fde9a8;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.warn{background:#35161a;border-color:#7a2a33;color:#ffc9cf}
.prog{display:flex;align-items:center;gap:10px;margin:8px 2px}.bar{flex:1;height:10px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar div{height:100%;background:var(--ok);transition:width .25s}
.meta{margin:4px 0}.hint{background:#0f2a1c;border:1px solid #1f6b3e;border-radius:12px;padding:8px 10px;margin:8px 0;font-size:15px}
.sets{margin-top:8px}.set{display:grid;grid-template-columns:30px 1fr 1fr 64px;gap:8px;align-items:center;margin:6px 0}
.set.hdr{font-size:12px;color:var(--mut);margin:4px 0 0}
.set .n{color:var(--mut);font-weight:700;text-align:center}
input,textarea{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:18px;min-height:52px;font-family:inherit}
textarea{min-height:80px;margin:8px 0}
input[type=checkbox]{width:28px;height:28px;min-height:0;flex:none;accent-color:var(--ok)}
.set input{text-align:center;font-weight:600}
.chk{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--mut);font-size:26px;font-weight:800}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#06210f}
.set.done input{opacity:.6}
.plate-hint{color:#9ec5ff;min-height:0;margin-top:2px}.plate-hint:empty{display:none}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.mini{min-height:44px;padding:8px 12px;font-size:15px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:#ff9aa5;border-color:#7a2a33}
.btn.big{min-height:56px;font-size:20px}
.btn:disabled{opacity:.4}
.filebtn{cursor:pointer}
.swap{margin-top:8px}.alt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:16px}
.alt.on{border-color:var(--acc)}
.det{border-top:1px solid var(--line);margin-top:10px;padding-top:6px;font-size:15px;color:#cbd5ec}
.chkrow{display:flex;gap:12px;align-items:flex-start;padding:6px 0}.chkrow.sm{align-items:center;min-height:44px}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.rpe button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:19px;font-weight:700}
.rpe button.on{background:var(--acc);border-color:var(--acc)}
.card .btn.big{width:100%;margin-top:6px}
.water{display:flex;align-items:center;gap:14px;justify-content:space-between}.wnum{text-align:center;font-size:22px}.wnum b{font-size:40px}
.water .btn{width:84px}
.drops{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;font-size:24px}.drop{opacity:.25}.drop.f{opacity:1}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.scale button{min-height:64px;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;gap:2px}
.scale b{font-size:22px}.scale button.on{background:var(--acc);border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.two label,label{font-size:13px;color:var(--mut);display:block}
label input{margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stats.big{grid-template-columns:repeat(2,1fr)}
.stats div{background:var(--card2);border-radius:12px;padding:10px;text-align:center}.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--mut)}
.chart{width:100%;height:auto;margin:6px 0}.chart .grid{stroke:var(--line);stroke-width:1}.chart .ax{fill:var(--mut);font-size:10px}
.chart .goal{stroke:var(--ok);stroke-dasharray:5 4;stroke-width:1.5}.chart .gl{fill:var(--ok);font-size:10px}.chart .startl{stroke:var(--mut);stroke-dasharray:2 4}
.chart .ln{stroke:var(--acc);stroke-width:2.5}.chart .pt{fill:var(--acc)}
.list .li,.li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.good{color:var(--ok)}.bad{color:var(--warn)}
.x{background:none;border:0;color:var(--mut);font-size:18px;min-width:44px;min-height:44px}
.table .tr{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 1fr 40px;gap:4px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}.table .th{color:var(--mut);font-size:12px}
.table .x{min-width:0;min-height:36px;font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:3/4}.ph img{width:100%;height:100%;object-fit:cover}.ph span{position:absolute;bottom:0;left:0;right:0;background:#000a;font-size:12px;padding:2px}
.overlay{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}.overlay img{flex:1;min-height:0;object-fit:contain;width:100%}
.ov-bar{display:flex;gap:10px;align-items:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:#111}.ov-bar span{flex:1}
.wk{display:flex;align-items:center;justify-content:space-between}
.sec{margin:16px 4px 4px;font-size:18px}
.hist summary{cursor:pointer;list-style:none;min-height:44px}.hist .hx{padding:6px 0;border-top:1px solid var(--line);margin-top:6px;font-size:15px}.notes{font-style:italic;color:var(--mut)}
.spec{margin:8px 0;font-size:15px}.link{display:block;background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0;text-decoration:none;color:var(--txt)}
details summary{min-height:32px}
ol{padding-left:20px}
#timer{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:20;background:#0f1a33;border:1px solid var(--acc);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;overflow:hidden;max-width:604px;margin:0 auto;box-shadow:0 6px 20px #0008}
#timer[hidden]{display:none}#timer.go{background:#0f3a20;border-color:var(--ok)}
#tfill{position:absolute;left:0;bottom:0;height:4px;background:var(--acc);width:0}#tl{flex:1;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
#timer .btn{min-height:44px;padding:6px 12px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0e1628;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px;min-height:60px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button span{font-size:22px;line-height:1}#nav button.on{color:var(--acc)}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:#1f2d52;border:1px solid var(--acc);padding:12px 16px;border-radius:14px;z-index:60;max-width:92%;transition:transform .25s;font-weight:600;text-align:center}
#toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}.confetti span{position:absolute;top:-40px;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){.bar div,#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer" hidden><div id="tfill"></div><span id="tl">Rest</span><button class="btn" data-act="timer-add">+15s</button><button class="btn" data-act="timer-skip">Skip</button></div>
<div id="toast" role="status"></div>
<nav id="nav"><button data-tab="workout"><span>🏋️</span>Workout</button><button data-tab="daily"><span>💧</span>Daily</button><button data-tab="progress"><span>📈</span>Progress</button><button data-tab="history"><span>🗓️</span>History</button><button data-tab="more"><span>⚙️</span>More</button></nav>
<noscript>This app needs JavaScript.</noscript>
<script>
const PLANS={"Kevin":{"Mon":{"focus":"Push: chest, shoulders, triceps","minutes":"30–45 min","warmup":"5 min easy Peloton, then arm circles, wall slides or light face pulls, and 8–10 push-ups or a light Smith bench ramp-up. Set Smith safety spotters just below chest height before you work.","exercises":[{"id":"k-smith-bench","name":"Smith bench press","sets":4,"reps":"8–10","rest":90,"top":10,"station":"Smith bar + bench. Safety spotters just below the bottom of the press. Bar starting weight is 40 lb; log total weight including the bar.","cue":"Feet planted, slight arch, lower with control to mid-chest, don't bounce. Keep elbows about 45–70° from your torso if shoulders complain."},{"id":"k-db-ohp","name":"Dumbbell overhead press","sets":3,"reps":"10","rest":75,"top":10,"station":"Dumbbells (5–45 lb), seated on the bench with back support if you have it.","cue":"Press up, don't shrug. Stop short of pain in the shoulders. If 45s get easy, switch to a Smith standing or seated overhead press (bar goes up to about 78\")."},{"id":"k-inc-db","name":"Incline dumbbell press","sets":3,"reps":"10–12","rest":75,"top":12,"station":"Adjustable bench on a moderate incline + dumbbells, inside the rack or just in front.","cue":"Moderate incline only (not steeper than you need). Lower to the upper chest, press up without flaring elbows wide."},{"id":"k-fly-lat","name":"Cable fly or lateral raise","sets":3,"reps":"12–15","rest":60,"top":15,"station":"Fly: 2:1 functional-trainer trolleys at mid/high, D-handles. Laterals: dumbbells, or one cable at the low trolley. Log the stack pin number on cables (2:1 feels like half the pin weight).","cue":"Soft elbow, squeeze at the end, no swinging. Pick one variation and stick with it for a few weeks."},{"id":"k-pushdown","name":"Cable triceps pushdown","sets":3,"reps":"12","rest":60,"top":12,"station":"High pulley (2:1 trolley or 1:1 high tower) with the included tricep rope or aluminum tricep/curl bar.","cue":"Elbows stay by your sides. Finish with a straight arm and a controlled return."}],"finisher":"10 min Peloton HIIT (30 sec harder, 30 sec easy). Warm the first minute easy."},"Tue":{"focus":"Pull: back, biceps","minutes":"30–45 min","warmup":"5 min easy Peloton, then shoulder circles, cat-camel, and a light pulldown or row ramp-up. If doing pull-ups, do a couple of easy reps or use the assistance strap first.","exercises":[{"id":"k-pullup","name":"Pull-ups or lat pulldown","sets":4,"reps":"6–10","rest":90,"top":10,"station":"Pull-ups: multi-grip pull-up bar. Assistance: the included pull-up strap on a cable. Pulldown: 1:1 high towers (200 lb stack feels like about 230 lb) + lat seat + aluminum lat bar.","cue":"Chest up, pull elbows down toward your pockets, don't shrug into your ears. Prefer pulldowns if shoulders or elbows complain."},{"id":"k-cable-row","name":"Seated cable row","sets":3,"reps":"10–12","rest":75,"top":12,"station":"Low-row station with the included row foot plate and close-grip row attachment or D-handles. Stock low row is 2:1 (pin weight feels like half). A 1:1 low-pulley kit is optional and not assumed.","cue":"Sit tall, pull to the lower ribs, squeeze shoulder blades, then let the arms stretch forward without rounding the lower back."},{"id":"k-db-row","name":"One-arm dumbbell row","sets":3,"reps":"10/arm","rest":75,"top":10,"station":"Bench + dumbbells, one knee and hand on the bench.","cue":"Back flat, pull the bell to the hip, don't twist the torso. Log each arm."},{"id":"k-facepull","name":"Cable face pulls","sets":3,"reps":"15","rest":60,"top":15,"station":"2:1 functional trainer, high trolley, included tricep rope.","cue":"Pull to the face or upper chest, rotate the hands so the knuckles go back, and keep the neck relaxed. Great for shoulders at 55."},{"id":"k-curls","name":"Dumbbell curls","sets":3,"reps":"12","rest":60,"top":12,"station":"Dumbbells, or the aluminum curl bar on a low 2:1 trolley.","cue":"Elbows quiet at your sides, no swinging. Full lower, controlled lift."}],"finisher":"10 min easy-moderate Peloton ride."},"Wed":{"focus":"Legs and core","minutes":"30–45 min","warmup":"5 min easy Peloton, 10 bodyweight squats, 10 leg swings each side, and a few hip hinges. Set Smith safety spotters just below the bottom of your squat before you load the bar.","exercises":[{"id":"k-smith-squat","name":"Smith squat","sets":4,"reps":"8–10","rest":90,"top":10,"station":"Smith bar, safety spotters just below parallel (or your comfortable depth). Bar starting weight is 40 lb; log total weight including the bar.","cue":"Brace, sit back and down, keep heels down. Stop around parallel if knees or hips prefer it; don't bounce out of the bottom."},{"id":"k-rdl","name":"Dumbbell Romanian deadlift","sets":3,"reps":"10","rest":75,"top":10,"station":"Dumbbells. If 45s get easy, use the Smith bar for the same hinge (the bar travels down to about 11\", which is low enough for a good stretch).","cue":"Soft knees, push the hips back, keep the back flat, feel the hamstrings, then stand tall. Don't round or yank."},{"id":"k-lunge","name":"Reverse lunge or walking lunge","sets":3,"reps":"10/leg","rest":75,"top":10,"station":"Dumbbells on the floor. Reverse lunges are usually friendlier on the knees than walking lunges or Bulgarian split squats.","cue":"Long enough step that the front knee stays over the mid-foot. Drop the back knee under control. Use a bench-supported split squat if balance is off."},{"id":"k-leg-ext","name":"Leg extension","sets":3,"reps":"12–15","rest":60,"top":15,"station":"Bench leg extension/curl attachment (Blazzed's official option is the X4 bench attachment: seated extension). Not a rack-mounted station on the HD1-S.","cue":"Don't slam the top. Pause briefly, lower slowly. Reduce range if the knees complain."},{"id":"k-leg-curl","name":"Leg curl","sets":3,"reps":"12–15","rest":60,"top":15,"station":"Same bench attachment, prone (lying) curl.","cue":"Hips stay on the pad, curl heels toward the glutes, lower slowly."},{"id":"k-plank","name":"Plank","sets":3,"reps":"45 sec","rest":45,"top":45,"timed":true,"station":"Floor, mat if you have one.","cue":"Elbows under shoulders, ribs down, squeeze glutes. Drop to knees if form fades. Log seconds."},{"id":"k-crunch","name":"Cable crunch","sets":3,"reps":"15","rest":60,"top":15,"station":"High pulley with the rope, kneeling.","cue":"Round the ribs toward the hips; don't yank with the arms."}],"finisher":"Core work above is the finisher. Optional 5 min easy spin if you still feel cold or stiff."},"Thu":{"focus":"Push (variation)","minutes":"30–45 min","warmup":"5 min easy Peloton, arm circles, light band or cable face pulls, and a light Smith incline ramp-up. Set safety spotters under the bar path.","exercises":[{"id":"k-smith-inc","name":"Smith incline press","sets":4,"reps":"8–10","rest":90,"top":10,"station":"Smith bar + bench on a moderate incline, safety spotters set just below the bottom.","cue":"Same rules as flat bench: controlled lower, don't bounce, keep the neck relaxed."},{"id":"k-db-flat","name":"Dumbbell flat press","sets":3,"reps":"10","rest":75,"top":10,"station":"Flat bench + dumbbells.","cue":"Lower with control, press up without banging the bells together hard."},{"id":"k-arnold","name":"Arnold press","sets":3,"reps":"10","rest":75,"top":10,"station":"Dumbbells, seated.","cue":"Rotate as you press, stay in a comfortable range. Switch to a plain seated DB press if the rotation bothers a shoulder."},{"id":"k-laterals","name":"Lateral raises","sets":3,"reps":"15","rest":60,"top":15,"station":"Dumbbells, or a 2:1 low cable with a D-handle.","cue":"Lead with the elbows, stop around shoulder height, no swing."},{"id":"k-oh-tri","name":"Overhead dumbbell triceps extension","sets":3,"reps":"12","rest":60,"top":12,"station":"One or two dumbbells, seated, or a cable with the rope at a high or mid trolley.","cue":"Elbows point up, don't flare wide. Shorten the range if it pinches the elbows or shoulders."}],"finisher":"10 min Peloton ride, easy to moderate."},"Fri":{"focus":"Pull (variation)","minutes":"30–45 min","warmup":"5 min easy Peloton, then light pulldowns or rows and a few bodyweight hip hinges.","exercises":[{"id":"k-smith-row","name":"Smith bent-over row","sets":4,"reps":"8–10","rest":90,"top":10,"station":"Smith bar. Because the bar path is fixed, hinge and stay in a groove that doesn't round the back. Safety spotters can sit just below the stretch.","cue":"Soft knees, flat back, pull to the lower ribs, lower under control."},{"id":"k-cg-lat","name":"Close-grip lat pulldown","sets":3,"reps":"10–12","rest":75,"top":12,"station":"1:1 high towers + lat seat + close-grip row attachment or a close grip on the lat bar.","cue":"Pull to the upper chest, elbows in, no leaning way back."},{"id":"k-rear-delt","name":"Rear-delt dumbbell fly","sets":3,"reps":"15","rest":60,"top":15,"station":"Dumbbells, bent over or chest on a slightly incline bench. Cable face-pull style is a fine swap.","cue":"Soft elbows, squeeze the rear shoulders, don't yank with the lower back."},{"id":"k-hammer","name":"Hammer curls","sets":3,"reps":"12","rest":60,"top":12,"station":"Dumbbells, neutral grip.","cue":"Thumbs up, elbows still, controlled lower."},{"id":"k-shrugs","name":"Smith shrugs","sets":3,"reps":"12","rest":60,"top":12,"station":"Smith bar, standing, walk-under height is 73.25\".","cue":"Straight up and down, pause at the top, don't roll the shoulders."}],"finisher":"10 min Peloton HIIT (30 sec harder, 30 sec easy)."},"Sat":{"focus":"Legs and conditioning","minutes":"30–45 min","warmup":"5 min easy Peloton, 10 bodyweight squats, 10 leg swings each side, and a couple of bodyweight hip thrusts or glute bridges.","exercises":[{"id":"k-split-squat","name":"Smith split squat","sets":3,"reps":"10/leg","rest":75,"top":10,"station":"Smith bar, safety spotters set just below the bottom. Back foot can rest lightly on the floor, or on the bench if you like a Bulgarian stance and your hips allow it.","cue":"Front heel down, drop the back knee, stay tall. Reverse lunges with dumbbells are the swap if the Smith stance feels awkward."},{"id":"k-hip-thrust","name":"Smith hip thrust","sets":3,"reps":"10–12","rest":75,"top":12,"station":"Smith bar (low starting height is about 11\", which is what this movement needs) + bench for upper-back support. Pad the bar if you have a pad or towel.","cue":"Chin tucked, ribs down, drive through the heels, squeeze at the top without over-arching the lower back."},{"id":"k-goblet","name":"Goblet squat","sets":3,"reps":"12","rest":60,"top":12,"station":"One dumbbell held at the chest. If 45 lb is easy, use a lighter Smith squat or slower tempo.","cue":"Elbows inside the knees if you can, heels down, controlled depth."},{"id":"k-calf","name":"Smith calf raise","sets":3,"reps":"15","rest":45,"top":15,"station":"Smith bar, standing. A sturdy plate or small step under the balls of the feet helps if you have one; otherwise use the floor.","cue":"Pause at the top, lower slowly through a comfortable stretch. Don't bounce."}],"finisher":"20 min Peloton endurance or climb ride, conversational pace — this is conditioning, not an all-out race."},"Sun":{"focus":"Rest day","minutes":"Easy movement only","warmup":"None required. A walk or an easy Peloton spin is fine if you want to move.","exercises":[],"finisher":"Sleep, protein, and a walk if you feel like it."}},"Sasha":{"Mon":{"focus":"Upper push: strength and bone loading","minutes":"30–45 min","warmup":"5 min easy Peloton, arm circles, wall slides or light face pulls, and a very light Smith or dumbbell press ramp-up. Set Smith safety spotters before you start.","exercises":[{"id":"s-smith-bench","name":"Smith bench press","sets":3,"reps":"8–12","rest":75,"top":12,"station":"Smith bar + bench, safety spotters just below chest height. Bar starts at 40 lb; that's a good first work weight until the movement feels smooth. Log total weight including the bar.","cue":"Lower with control, press up without bouncing. Leav function fmtDate(iso){return dUTC(iso).toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});}
function fmtShort(iso){return dUTC(iso).toLocaleDateString('en-US',{timeZone:'UTC',month:'short',day:'numeric'});}

/* ---------- store ---------- */
function blank(){return {v:1,lastPerson:'Kevin',
  goals:{Kevin:{start:'219',goal:'180'},Sasha:{start:'',goal:''}},
  weighIns:{Kevin:[],Sasha:[]},measures:{Kevin:[],Sasha:[]},
  daily:{},sessions:{},drafts:{},
  settings:{plates:[45,35,25,10,5,2.5],bar:40,waterGoal:8,showDetails:true},lastBackup:null,
  extraPeople:[],planFor:{}};}
function collectExtra(p){
  const names=[],add=n=>{
    if(typeof n!=='string')return;
    n=n.trim();
    if(!n||n.indexOf('|')>=0||PEOPLE.indexOf(n)>=0||names.indexOf(n)>=0)return;
    names.push(n);
  };
  if(!p||typeof p!=='object')return names;
  if(Array.isArray(p.extraPeople))p.extraPeople.forEach(add);
  if(p.sessions&&typeof p.sessions==='object'&&!Array.isArray(p.sessions))Object.keys(p.sessions).forEach(k=>{const s=p.sessions[k];if(s&&typeof s==='object')add(s.person);});
  if(p.goals&&typeof p.goals==='object')Object.keys(p.goals).forEach(add);
  ['weighIns','measures'].forEach(k=>{if(p[k]&&typeof p[k]==='object')Object.keys(p[k]).forEach(add);});
  if(p.daily&&typeof p.daily==='object')Object.keys(p.daily).forEach(k=>add(String(k).split('|')[0]));
  if(p.drafts&&typeof p.drafts==='object')Object.keys(p.drafts).forEach(k=>add(String(k).split('|')[0]));
  return names;
}
function normalize(p){
  const b=blank();if(!p||typeof p!=='object')return b;
  const o=Object.assign(b,p);
  o.extraPeople=collectExtra(p);
  o.planFor={};
  const src=p.planFor&&typeof p.planFor==='object'?p.planFor:{};
  o.extraPeople.forEach(n=>{if(src[n]==='Kevin'||src[n]==='Sasha')o.planFor[n]=src[n];});
  o.goals=Object.assign(blank().goals,p.goals||{});
  const names=PEOPLE.concat(o.extraPeople);
  names.forEach(n=>{o.goals[n]=Object.assign({start:'',goal:''},o.goals[n]);
    ['weighIns','measures'].forEach(k=>{o[k]=Object.assign({Kevin:[],Sasha:[]},p[k]||{});if(!Array.isArray(o[k][n]))o[k][n]=[];});});
  o.daily=p.daily&&typeof p.daily==='object'?p.daily:{};
  o.sessions=p.sessions&&typeof p.sessions==='object'&&!Array.isArray(p.sessions)?p.sessions:{};
  o.drafts=p.drafts&&typeof p.drafts==='object'?p.drafts:{};
  o.settings=Object.assign(blank().settings,p.settings||{});
  if(!Array.isArray(o.settings.plates)||!o.settings.plates.length)o.settings.plates=blank().settings.plates;
  if(names.indexOf(o.lastPerson)<0)o.lastPerson=names[0];
  return o;
}

function allPeople(){

function savePins(o){try{localStorage.setItem(PIN_KEY,JSON.stringify(o));}catch(e){memoryOnly=true;}}
function randSalt(){
  const a=new Uint8Array(16);
  if(crypto&&crypto.getRandomValues)crypto.getRandomValues(a);
  else for(let i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256);
  return [...a].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function hashPin(pin,salt){
  const bytes=new TextEncoder().encode(String(salt)+':'+String(pin));
  if(crypto&&crypto.subtle&&crypto.subtle.digest){
    return crypto.subtle.digest('SHA-256',bytes).then(buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''));
  }
  let h=2166136261;bytes.forEach(b=>{h^=b;h=Math.imul(h,16777619);});
  return Promise.resolve('fnv'+(h>>>0).toString(16));
}
function pinMatches(name,pin){
  const rec=loadPins()[name];
  if(!rec||!rec.hash)return Promise.resolve(false);
  return hashPin(pin,rec.salt).then(h=>h===rec.hash);
}
function ensurePerson(name){

  if(!Array.isArray(store.weighIns[name]))store.weighIns[name]=[];
  if(!Array.isArray(store.measures[name]))store.measures[name]=[];
  if(PEOPLE.indexOf(name)<0){
    if(!Array.isArray(store.extraPeople))store.extraPeople=[];
    if(store.extraPeople.indexOf(name)<0)store.extraPeople.push(name);
    if(!store.planFor||typeof store.planFor!=='object')store.planFor={};
  }
}

/* ---------- sessions helpers ---------- */
const sessionsOf=p=>Object.values(store.sessions).filter(s=>s&&s.person===p).sort((a,b)=>(a.date+(a.finishedAt||''))<(b.date+(b.finishedAt||''))?1:-1);
function draftTouched(d){
  if(!d||typeof d!=='object')return false;
  if(d.notes||d.warm||d.rpe)return true;
  if(d.prNames&&d.prNames.length)return true;
  const sets=d.sets||{};
  return Object.keys(sets).some(k=>(sets[k]||[]).some(s=>s&&(s.d||(s.w!==''&&s.w!=null)||(s.r!==''&&s.r!=null))));
}
function hasProfileData(p){
  if(sessionsOf(p).length)return true;
  if((store.weighIns[p]||[]).length)return true;
  if((store.measures[p]||[]).length)return true;
  const pre=p+'|';
  if(Object.keys(store.daily||{}).some(k=>k.indexOf(pre)===0&&store.daily[k]&&Object.keys(store.daily[k]).some(f=>store.daily[k][f]!=null&&store.daily[k][f]!==''&&store.daily[k][f]!==0)))return true;
  if(Object.keys(store.drafts||{}).some(k=>k.indexOf(pre)===0&&draftTouched(store.drafts[k])))return true;
  const g=store.goals[p]||{},def=(blank().goals[p])||{start:'',goal:''};
  if((g.start||'')!==(def.start||'')||(g.goal||'')!==(def.goal||''))return true;
  return false;
}
function doneSets(sets){return (sets||[]).filter(s=>s&&s.r!==''&&s.r!=null&&!isNaN(num(s.r)));}
function lastFor(person,key){
  for(const s of sessionsOf(person)){const e=(s.exercises||[]).find(x=>x.key===key);if(e&&doneSets(e.sets).length)return doneSets(e.sets);}
  return null;
}
function score(w,r){const W=num(w),R=num(r);if(isNaN(R)||R<=0)return 0;if(!isNaN(W)&&W>0)return W*(1+Math.min(R,15)/30);return R;}
function bestScore(person,key){
  let b=0;sessionsOf(person).forEach(s=>(s.exercises||[]).forEach(e=>{if(e.key===key)doneSets(e.sets).forEach(x=>{b=Math.max(b,score(x.w,x.r));});}));return b;
}
function records(person){
  const m={};
  sessionsOf(person).slice().reverse().forEach(s=>(s.exercises||[]).forEach(e=>doneSets(e.sets).forEach(x=>{
    const sc=score(x.w,x.r);const c=m[e.key];
    if(!c||sc>c.sc){m[e.key]={key:e.key,name:e.name,sc,w:x.w,r:x.r,date:s.date};}
    const W=num(x.w);if(!isNaN(W)){const cc=m[e.key];if(!cc.maxW||W>cc.maxW)cc.maxW=W;}
  })));
  return Object.values(m).sort((a,b)=>a.date<b.date?1:-1);
}
const volOf=sets=>doneSets(sets).reduce((a,x)=>{const w=num(x.w),r=num(x.r);return a+((isNaN(w)?0:w)*r);},0);
function fmtSets(sets){return doneSets(sets).map(x=>(x.w!==''&&x.w!=null?x.w+'×':'')+x.r).join(', ');}

/* ---------- drafts ---------- */
const dk=(p,d)=>p+'|'+d;
function planOf(p,d){
  const base=PLANS[p]?p:((store.planFor&&PLANS[store.planFor[p]])?store.planFor[p]:'Sasha');
  return PLANS[base][d];
}
function exData(ex,draft){const i=draft.swaps&&draft.swaps[ex.id];
  if(i==null)return {key:ex.id,name:ex.name,swapOf:null};
  const alt=(SWAP_LIB[SWAP_CAT[ex.id]]||[])[i];
  return alt?{key:ex.id+'~'+i,name:alt.n,swapOf:ex.name,tip:alt.t}:{key:ex.id,name:ex.name,swapOf:null};}
function ensureSets(draft,ex,key,person){
  if(draft.sets[key]&&draft.sets[key].length)return;
  const last=lastFor(person,key)||[];const arr=[];
  for(let i=0;i<ex.sets;i++){const l=last[i]||last[last.length-1];arr.push({w:l?String(l.w==null?'':l.w):'',r:l?String(l.r==null?'':l.r):'',d:false});}
  draft.sets[key]=arr;
}
function getDraft(person,day){
  const k=dk(person,day),t=nowDenver().date;let d=store.drafts[k];
  if(d){const any=Object.values(d.sets||{}).some(a=>a.some(s=>s.d));if(d.date!==t&&!any){delete store.drafts[k];d=null;}}
  if(!d){d={day,date:t,sets:{},swaps:{},warm:false,cool:{},rpe:null,notes:'',pr:{},prNames:[],applied:{}};store.drafts[k]=d;}
  const plan=planOf(person,day);
  plan.exercises.forEach(ex=>{const x=exData(ex,d);ensureSets(d,ex,x.key,person);});
  return d;
}

/* ---------- plate / dumbbell hints ---------- */
function plateHint(ex,w){
  const W=num(w);if(isNaN(W)||W<=0)return '';
  const isSmith=/smith/i.test(ex.name)&&!/goblet/i.test(ex.name)&&!ex.swapped;
  if(isSmith){
    const bar=Number(store.settings.bar)||40;
    if(W<bar)return 'Under the '+bar+' lb bar weight. Use dumbbells for this one.';
    let per=(W-bar)/2;if(per===0)return 'Bar only ('+bar+' lb).';
    const plates=store.settings.plates.slice().map(Number).sort((a,b)=>b-a);const out=[];let rem=per;
    plates.forEach(p=>{while(rem+1e-9>=p){out.push(p);rem-=p;}});
    const txt=out.join(' + ');
    return 'Smith '+W+' lb = '+bar+' lb bar + '+(txt||'0')+' per side'+(rem>0.01?' (closest; '+round1(rem*2)+' lb short)':'')+'.';
  }
  if(/dumbbell|curl|row|press|raise|fly|lunge|squat|rdl|shrug/i.test(ex.station+' '+ex.name)&&/dumbbell/i.test(ex.station+' '+ex.name)){
    if(W>45)return 'Dumbbells top out at 45 lb. Slow the tempo, add reps, or switch to the Smith or a cable.';
    if(W%5!==0)return 'Dumbbells go in 5 lb steps. Nearest: '+(Math.round(W/5)*5)+' lb each hand.';
    return 'Dumbbell: '+W+' lb in each hand.';
  }
  if(/cable|pulldown|pushdown|row|trolley/i.test(ex.station)&&/cable|pulldown|pushdown|row|face/i.test(ex.name)){
    return 'Log the stack pin weight. 2:1 trolleys feel like about half; 1:1 towers feel heavier.';
  }
  return '';
}

function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),ms||2600);}

let ac=null;
function unlockAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function beep(){if(!ac)return;try{[0,.28,.56].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=t>.5?1175:880;g.gain.value=.18;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.16);});}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200]);}
let timer=null,tInt=null;
function startTimer(sec){timer={end:Date.now()+sec*1000,total:sec,fired:false};tick();if(!tInt)tInt=setInterval(tick,250);}
function tick(){
  const bar=$('#timer');if(!timer){bar.hidden=true;if(tInt){clearInterval(tInt);tInt=null;}return;}
  bar.hidden=false;const left=Math.ceil((timer.end-Date.now())/1000);
  if(left<=0){if(!timer.fired){timer.fired=true;beep();}
    $('#tl').textContent='Go! Next set';$('#tfill').style.width='100%';bar.classList.add('go');
    if(Date.now()-timer.end>5000){timer=null;bar.classList.remove('go');tick();}return;}
  bar.classList.remove('go');
  $('#tl').textContent='Rest '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  $('#tfill').style.width=Math.max(0,Math.min(100,100*(1-left/timer.total)))+'%';
}

function exCard(person,ex,d){
  const x=exData(ex,d),sets=d.sets[x.key],last=lastFor(person,x.key);
  const e2={name:x.name,station:ex.station,swapped:x.swapOf!=null};
  let h='<section class="card ex" data-ex="'+ex.id+'" data-key="'+esc(x.key)+'"><div class="exh"><h3>'+esc(x.name)+'</h3></div>';
  if(x.swapOf)h+='<div class="tiny muted">Swapped in for: '+esc(x.swapOf)+'</div>';
  h+='<div class="meta"><b>'+ex.sets+' × '+esc(ex.reps)+'</b> · rest '+ex.rest+' sec'+(ex.timed?' · timed hold':'')+'</div>';
  if(last){
    const s=last.slice(0,ex.sets);h+='<div class="tiny muted">Last time: '+esc(fmtSets(s))+'</div>';
    const hint=overload(ex,last);

function overload(ex,last){
  const L=last.slice(0,ex.sets);if(L.length<ex.sets||!ex.top)return null;
  if(!L.every(s=>num(s.r)>=ex.top))return null;
  if(ex.timed)return {text:'You hit '+ex.top+' sec on every set. Next time add 5-10 seconds.'};
  const w=num(L[0].w);
  if(isNaN(w)||w<=0)return {text:'You hit the top of the range on every set. Next time add 1-2 reps or make it harder.'};
  return {w:w+5,text:'You hit the top of the range ('+ex.reps+') on every set at '+w+' lb. Try '+(w+5)+' lb (+5 lb) today.'};
}

function weightChart(wi,start,goal){
  if(!wi.length)return '<p class="muted">Log a weigh-in to see your chart.</p>';
  const W=340,H=210,L=38,R=12,T=14,B=26;
  const vals=wi.map(x=>x.lbs);if(!isNaN(goal))vals.push(goal);if(!isNaN(start))vals.push(start);
  let mn=Math.min.apply(null,vals)-3,mx=Math.max.apply(null,vals)+3;if(mx-mn<8){mx+=4;mn-=4;}
  const t0=dUTC(wi[0].date).getTime(),t1=dUTC(wi[wi.length-1].date).getTime();
  const X=d=>t1===t0?L+(W-L-R)/2:L+(W-L-R)*(dUTC(d).getTime()-t0)/(t1-t0),Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Body weight chart">';
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="grid"/><text x="'+(L-5)+'" y="'+(y+4)+'" text-anchor="end" class="ax">'+Math.round(v)+'</text>';}
  if(!isNaN(goal))s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(goal)+'" y2="'+Y(goal)+'" class="goal"/><text x="'+(W-R)+'" y="'+(Y(goal)-4)+'" text-anchor="end" class="gl">Goal '+goal+'</text>';
  if(!isNaN(start)&&start!==goal)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(start)+'" y2="'+Y(start)+'" class="startl"/><text x="'+L+'" y="'+(Y(start)-4)+'" class="ax">Start '+start+'</text>';
  s+='<polyline class="ln" fill="none" points="'+wi.map(x=>X(x.date).toFixed(1)+','+Y(x.lbs).toFixed(1)).join(' ')+'"/>';
  wi.forEach(x=>{s+='<circle cx="'+X(x.date).toFixed(1)+'" cy="'+Y(x.lbs).toFixed(1)+'" r="4" class="pt"/>';});
  s+='<text x="'+L+'" y="'+(H-6)+'" class="ax">'+fmtShort(wi[0].date)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" class="ax">'+fmtShort(wi[wi.length-1].date)+'</text></svg>';
  return s;
}

function weekStats(p,ws){
  const we=addDays(ws,6),ss=sessionsOf(p).filter(s=>s.date>=ws&&s.date<=we);
  const vol=ss.reduce((a,s)=>a+(s.volume||0),0),sets=ss.reduce((a,s)=>a+(s.setCount||0),0),rp=ss.filter(s=>s.rpe).map(s=>s.rpe);
  const days=[];for(let i=0;i<7;i++){const d=store.daily[dk(p,addDays(ws,i))];if(d)days.push(d);}
  const avg=f=>{const v=days.map(d=>num(d[f])).filter(x=>!isNaN(x)&&x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:NaN;};
  const wi=store.weighIns[p].slice().sort((a,b)=>a.date<b.date?-1:1);
  const inWk=wi.filter(x=>x.date>=ws&&x.date<=we),before=wi.filter(x=>x.date<ws);
  let wc=NaN;if(inWk.length&&(before.length||inWk.length>1)){const ref=before.length?before[before.length-1].lbs:inWk[0].lbs;wc=inWk[inWk.length-1].lbs-ref;}
  return {n:ss.length,vol,sets,rpe:rp.length?rp.reduce((a,b)=>a+b,0)/rp.length:NaN,cal:avg('cal'),protein:avg('protein'),water:avg('water'),sleep:avg('sleep'),energy:avg('energy'),wc,prs:ss.reduce((a,s)=>a+((s.prs||[]).length),0)};
}

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('hd1s-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function idbAll(){return idb().then(db=>new Promise((res,rej)=>{const q=db.transaction('p').objectStore('p').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}));}
function idbPut(o){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('p','readwrite');t.objectStore('p').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error);}));}
function idbDel(id){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error);}));}
let photoCache=[];
async function loadPhotos(){
  const g=$('#photoGrid');if(!g)return;
  try{photoCache=(await idbAll()).filter(x=>x.person===ui.person).sort((a,b)=>a.date<b.date?1:-1);}catch(e){g.innerHTML='<p class="muted">Photos aren\u2019t available in this browser.</p>';return;}
  const gg=$('#photoGrid');if(!gg)return;
  gg.innerHTML=photoCache.length?photoCache.map(x=>'<button class="ph" data-act="viewphoto" data-id="'+esc(x.id)+'"><img src="'+x.data+'" alt=""><span>'+fmtShort(x.date)+'</span></button>').join(''):'<p class="muted">No photos yet.</p>';
}
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.8));};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};im.src=url;});}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==='warm'){const d=getDraft(ui.person,ui.day);d.warm=t.checked;save();}
  else if(t.dataset&&t.dataset.act==='cool'){const d=getDraft(ui.person,ui.day);d.cool[t.dataset.i]=t.checked;save();}
  else if(t.dataset&&t.dataset.act==='details'){store.settings.showDetails=t.checked;save();}
  else if(t.id==='photoIn'&&t.files[0]){const f=t.files[0];shrink(f).then(data=>idbPut({id:'p'+Date.now(),person:ui.person,date:nowDenver().date,data})).then(()=>{toast('Photo saved');loadPhotos();}).catch(()=>toast('Could not save that photo'));t.value='';}
  else if(t.id==='impIn'&&t.files[0]){const f=t.files[0];f.text().then(txt=>doImport(txt,false));t.value='';}
  else if(t.id==='impReplaceIn'&&t.files[0]){const f=t.files[0];f.text().then(txt=>doImport(txt,true));t.value='';}
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset||{};
  if(d.f&&t.closest('.set')){
    const row=t.closest('.set'),dr=getDraft(ui.person,ui.day),arr=dr.sets[row.dataset.key];if(!arr)return;
    arr[+row.dataset.i][d.f]=t.value;save();if(d.f==='w')updateHint(t);
  }else if(d.f==='notes'){getDraft(ui.person,ui.day).notes=t.value;save();}
  else if(d.daily){const k=dk(ui.person,nowDenver().date);store.daily[k]=store.daily[k]||{};store.daily[k][d.f]=t.value;save();}
  else if(d.goal){store.goals[ui.person][d.f]=t.value;save();}
  else if(d.set){const s=store.settings;
    if(d.set==='plates'){const v=t.value.split(/[ ,]+/).map(Number).filter(x=>x>0);if(v.length)s.plates=v;}
    else{const v=num(t.value);if(!isNaN(v)&&v>0)s[d.set]=v;}save();}
});
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('.set input'))updateHint(e.target);});
function updateHint(inp){
  const row=inp.closest('.set');if(!row)return;
  const card=row.closest('.ex'),ph=card.querySelector('.plate-hint');if(!ph)return;
  const w=row.querySelector('input[data-f="w"]').value;
  const plan=planOf(ui.person,ui.day),ex=plan.exercises.find(x=>x.id===row.dataset.ex);if(!ex)return;
  const d=getDraft(ui.person,ui.day),x=exData(ex,d);
  ph.textContent=plateHint({name:x.name,station:ex.station,swapped:x.swapOf!=null},w);
}
function act(a,b){
  const P=ui.person;
  switch(a){
    case 'person':if(!getDevice())chooseProfile(b.dataset.p);break;
    case 'lock':chooseProfile(b.dataset.p);break;
    case 'addperson':ui.adding=!ui.adding;render(true);break;
    case 'planchoice':ui.planChoice=b.dataset.plan==='Kevin'?'Kevin':'Sasha';document.querySelectorAll('[data-act="planchoice"]').forEach(btn=>btn.classList.toggle('primary',btn.dataset.plan===ui.planChoice));break;
    case 'createperson':{
      const raw=$('#newPerson')?$('#newPerson').value:'';
      const name=String(raw||'').trim();
      if(!name||name.length>24||name.indexOf('|')>=0){toast('Enter a name without the | character');break;}
      if(allPeople().some(n=>n.toLowerCase()===name.toLowerCase())){toast('That person is already here');break;}
      const plan=ui.planChoice==='Kevin'?'Kevin':'Sasha';
      if(!Array.isArray(store.extraPeople))store.extraPeople=[];
      store.extraPeople.push(name);
      store.planFor=store.planFor||{};
      store.planFor[name]=plan;
      ensurePerson(name);save();chooseProfile(name);break;}
    case 'savepin':{
      const v=($('#pinNew')&&$('#pinNew').value||'').trim();
      if(!/^\d{4}$/.test(v)){toast('Use a 4-digit PIN');break;}
      const salt=randSalt(),who=getDevice();
      hashPin(v,salt).then(hash=>{const pins=loadPins();pins[who]={salt,hash};savePins(pins);toast('PIN saved');render(true);}).catch(()=>toast('Could not save that PIN'));
      break;}
    case 'clearpin':{
      const v=($('#pinNew')&&$('#pinNew').value||'').trim(),who=getDevice();
      if(!/^\d{4}$/.test(v)){toast('Enter the current 4-digit PIN to remove it');break;}
      pinMatches(who,v).then(ok=>{if(!ok){toast('Wrong PIN');return;}const pins=loadPins();delete pins[who];savePins(pins);toast('PIN removed');render(true);}).catch(()=>toast('Could not check that PIN'));
      break;}
    case 'switchprofile':{
      const me=getDevice();if(!me){render();break;}
      if(loadPins()[me]){ui.gate='switch';ui.pendingProfile=null;render();break;}
      if(confirm('Switch profile on this phone?')){try{localStorage.removeItem(DEVICE_KEY);}catch(e){}ui.gate=null;ui.pendingProfile=null;render();}
      break;}
    case 'submitpin':{
      const pin=($('#pinTry')&&$('#pinTry').value||'').trim();
      if(!/^\d{4}$/.test(pin)){toast('Enter the 4-digit PIN');break;}
      const locking=ui.gate==='lock',who=locking?ui.pendingProfile:getDevice();
      pinMatches(who,pin).then(ok=>{
        if(!ok){toast('Wrong PIN');const el=$('#pinTry');if(el)el.value='';return;}
        if(locking){lockTo(who);return;}
        try{localStorage.removeItem(DEVICE_KEY);}catch(e){}
        ui.gate=null;ui.pendingProfile=null;render();
      }).catch(()=>toast('Could not check that PIN'));
      break;}
    case 'cancelpin':ui.gate=null;ui.pendingProfile=null;render();break;
    case 'day':ui.day=b.dataset.d;ui.swapOpen=null;render();break;
    case 'tab':ui.tab=b.dataset.tab;render();break;
    case 'tog':{
      unlockAudio();wake();
      const row=b.closest('.set'),d=getDraft(P,ui.day),arr=d.sets[row.dataset.key],i=+row.dataset.i,s=arr[i];
      s.d=!s.d;row.classList.toggle('done',s.d);b.setAttribute('aria-pressed',s.d?'true':'false');save();
      let dn=0,tot=0;Object.values(d.sets).forEach(a=>{tot+=a.length;dn+=a.filter(x=>x.d).length;});
      const pf=$('#pfill');if(pf)pf.style.width=(tot?100*dn/tot:0)+'%';const pt=$('#ptxt');if(pt)pt.textContent=dn+' / '+tot+' sets';
      if(s.d){
        const ex=planOf(P,ui.day).exercises.find(x=>x.id===row.dataset.ex);
        checkPR(P,d,row.dataset.key,s);
        if(ex&&dn<tot)startTimer(ex.rest);else if(dn===tot){timer=null;tick();toast('All sets done. Finish up and tap Finish workout.');}
      }
      break;}
    case 'addset':{const d=getDraft(P,ui.day),arr=d.sets[b.dataset.key],l=arr[arr.length-1]||{w:'',r:''};arr.push({w:l.w,r:l.r,d:false});save();render(true);break;}
    case 'rmset':{const d=getDraft(P,ui.day),arr=d.sets[b.dataset.key];if(arr.length>1){arr.pop();save();render(true);}break;}
    case 'swap':ui.swapOpen=ui.swapOpen===b.dataset.ex?null:b.dataset.ex;render(true);break;
    case 'pick':{const d=getDraft(P,ui.day),i=+b.dataset.i;if(i<0)delete d.swaps[b.dataset.ex];else d.swaps[b.dataset.ex]=i;ui.swapOpen=null;save();render(true);break;}
    case 'apply':{const d=getDraft(P,ui.day),arr=d.sets[b.dataset.key];arr.forEach(s=>{if(!s.d){const w=num(s.w);if(!isNaN(w))s.w=String(w+5);}});d.applied[b.dataset.key]=true;save();render(true);toast('Added 5 lb to the sets you haven\u2019t done yet');break;}
    case 'rpe':{const d=getDraft(P,ui.day);d.rpe=+b.dataset.n===d.rpe?null:+b.dataset.n;save();render(true);break;}
    case 'finish':finish();break;
    case 'reset':if(confirm('Clear everything you entered for this day?')){delete store.drafts[dk(P,ui.day)];save();render(true);}break;
    case 'dismiss':ui.saved=null;render(true);break;
    case 'timer-add':if(timer){timer.end+=15000;timer.total+=15;timer.fired=false;tick();}break;
    case 'timer-skip':timer=null;tick();break;
    case 'water':{const k=dk(P,nowDenver().date);store.daily[k]=store.daily[k]||{};store.daily[k].water=Math.max(0,(store.daily[k].water||0)+(+b.dataset.n));save();render(true);break;}
    case 'scale':{const k=dk(P,nowDenver().date);store.daily[k]=store.daily[k]||{};const n=+b.dataset.n;store.daily[k][b.dataset.f]=store.daily[k][b.dataset.f]===n?null:n;save();render(true);break;}
    case 'addweight':{const v=num($('#wi-lbs').value),dt=$('#wi-date').value||nowDenver().date;if(isNaN(v)||v<=0){toast('Enter your weight in pounds first');break;}
      const l=store.weighIns[P].filter(x=>x.date!==dt);l.push({date:dt,lbs:v});store.weighIns[P]=l;save();render(true);toast('Weigh-in saved');break;}
    case 'delweight':if(confirm('Delete this weigh-in?')){store.weighIns[P]=store.weighIns[P].filter(x=>x.date!==b.dataset.date);save();render(true);}break;
    case 'addmeasure':{const dt=$('#ms-date').value||nowDenver().date,m={date:dt};let any=false;['waist','chest','arm','hip'].forEach(f=>{const v=num($('#ms-'+f).value);if(!isNaN(v)&&v>0){m[f]=v;any=true;}});
      if(!any){toast('Enter at least one measurement');break;}
      const old=store.measures[P].find(x=>x.date===dt);if(old)Object.assign(old,m);else store.measures[P].push(m);save();render(true);toast('Measurements saved');break;}
    case 'delmeasure':if(confirm('Delete these measurements?')){store.measures[P]=store.measures[P].filter(x=>x.date!==b.dataset.date);save();render(true);}break;
    case 'viewphoto':{const p=photoCache.find(x=>x.id===b.dataset.id);if(p)showPhoto(p);break;}
    case 'wk':ui.weekOff=Math.min(0,ui.weekOff+(+b.dataset.n));render(true);break;
    case 'delsession':if(confirm('Delete this workout from history?')){delete store.sessions[b.dataset.k];save();render(true);}break;
    case 'export':doExport();break;
    case 'copyjson':{const txt=JSON.stringify(exportObj());(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Backup copied')).catch(()=>{$('#pasteJson').value=txt;$('#pasteJson').select();toast('Select all and copy the text');});break;}
    case 'pasteimport':doImport($('#pasteJson').value,false);break;
    case 'replaceimport':{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.id='impReplaceIn';i.hidden=true;document.body.appendChild(i);i.addEventListener('change',()=>{if(i.files[0])i.files[0].text().then(t=>doImport(t,true));i.remove();});i.click();break;}
  }
}
function showPhoto(p){
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML='<img src="'+p.data+'" alt=""><div class="ov-bar"><span>'+fmtDate(p.date)+'</span><button class="btn danger">Delete</button><button class="btn primary">Close</button></div>';
  o.querySelector('.danger').onclick=()=>{if(confirm('Delete this photo?')){idbDel(p.id).then(()=>{o.remove();loadPhotos();});}};
  o.querySelector('.primary').onclick=()=>o.remove();document.body.appendChild(o);
}
function checkPR(person,d,key,s){
  const sc=score(s.w,s.r);if(sc<=0)return;
  const prior=bestScore(person,key),seen=d.pr[key]||0;
  if(prior>0&&sc>Math.max(prior,seen)+1e-9){
    const ex=planOf(person,ui.day).exercises.find(e=>exData(e,d).key===key),name=ex?exData(ex,d).name:key;
    if(d.prNames.indexOf(name)<0)d.prNames.push(name);
    confetti();toast('🏆 New PR! '+name+': '+(num(s.w)>0?s.w+' lb × '+s.r:s.r+' reps'),4200);
  }
  if(sc>seen)d.pr[key]=sc;save();
}
function finish(){
  const P=ui.person,day=ui.day,plan=planOf(P,day),d=getDraft(P,day);
  const exs=[];let setCount=0,vol=0;
  plan.exercises.forEach(ex=>{const x=exData(ex,d),sets=(d.sets[x.key]||[]).filter(s=>s.d).map(s=>({w:s.w,r:s.r}));
    if(sets.length){exs.push({key:x.key,name:x.name,swapOf:x.swapOf,sets});setCount+=sets.length;vol+=volOf(sets);}});
  if(!exs.length){toast('Check off at least one set first');return;}
  const total=Object.values(d.sets).reduce((a,x)=>a+x.length,0),done=setCount;
  if(done<total&&!confirm('You completed '+done+' of '+total+' sets. Save this workout anyway?'))return;
  const id=P+'|'+d.date+'|'+day;
  store.sessions[id]={id,person:P,date:d.date,day,focus:plan.focus,finishedAt:new Date().toISOString(),rpe:d.rpe,notes:d.notes||'',warm:!!d.warm,cool:Object.values(d.cool).filter(Boolean).length,exercises:exs,setCount,volume:vol,prs:d.prNames.slice()};
  delete store.drafts[dk(P,day)];save();timer=null;tick();
  ui.saved={person:P,key:id};ui.swapOpen=null;render();toast('Workout saved. Nice work!');
}

/* ---------- export / import ---------- */
function currentPerson(){return getDevice()||ui.person;}
function exportObj(){
  const p=currentPerson();
  const o={v:store.v||1,app:'hd1s-workout-tracker',exportedAt:new Date().toISOString(),lastPerson:p,
    goals:{},weighIns:{},measures:{},daily:{},sessions:{},drafts:{},
    settings:JSON.parse(JSON.stringify(store.settings||blank().settings)),lastBackup:store.lastBackup||null,
    extraPeople:[],planFor:{}};
  o.goals[p]=JSON.parse(JSON.stringify(store.goals[p]||{start:'',goal:''}));
  o.weighIns[p]=JSON.parse(JSON.stringify(store.weighIns[p]||[]));
  o.measures[p]=JSON.parse(JSON.stringify(store.measures[p]||[]));
  Object.keys(store.sessions||{}).forEach(k=>{const s=store.sessions[k];if(s&&s.person===p)o.sessions[k]=JSON.parse(JSON.stringify(s));});
  Object.keys(store.daily||{}).forEach(k=>{if(k.indexOf(p+'|')===0)o.daily[k]=JSON.parse(JSON.stringify(store.daily[k]));});
  Object.keys(store.drafts||{}).forEach(k=>{if(k.indexOf(p+'|')===0)o.drafts[k]=JSON.parse(JSON.stringify(store.drafts[k]));});
  if((store.extraPeople||[]).indexOf(p)>=0){o.extraPeople=[p];if(store.planFor&&store.planFor[p])o.planFor[p]=store.planFor[p];}
  return o;
}
function peopleIn(inc){
  const set=[],add=n=>{if(n&&set.indexOf(n)<0)set.push(n);};
  Object.keys(inc.sessions||{}).forEach(k=>{const s=inc.sessions[k];if(s&&s.person)add(s.person);});
  Object.keys(inc.weighIns||{}).forEach(n=>{if((inc.weighIns[n]||[]).length)add(n);});
  Object.keys(inc.measures||{}).forEach(n=>{if((inc.measures[n]||[]).length)add(n);});
  Object.keys(inc.daily||{}).forEach(k=>{const n=String(k).split('|')[0],d=inc.daily[k];if(n&&d&&Object.keys(d).some(f=>d[f]!=null&&d[f]!==''&&d[f]!==0))add(n);});
  Object.keys(inc.goals||{}).forEach(n=>{
    const g=inc.goals[n]||{},def=(blank().goals[n])||{start:'',goal:''};
    if((g.start||'')!==(def.start||'')||(g.goal||'')!==(def.goal||''))add(n);
  });
  Object.keys(inc.drafts||{}).forEach(k=>{const n=String(k).split('|')[0];if(n&&draftTouched(inc.drafts[k]))add(n);});
  return set;
}
function clearPerson(p){
  Object.keys(store.sessions||{}).forEach(k=>{if(store.sessions[k]&&store.sessions[k].person===p)delete store.sessions[k];});
  Object.keys(store.daily||{}).forEach(k=>{if(k.indexOf(p+'|')===0)delete store.daily[k];});
  Object.keys(store.drafts||{}).forEach(k=>{if(k.indexOf(p+'|')===0)delete store.drafts[k];});
  store.weighIns[p]=[];store.measures[p]=[];store.goals[p]={start:'',goal:''};
}
function remapPerson(inc,from,to){
  const sessions={},daily={},drafts={};
  Object.keys(inc.sessions||{}).forEach(k=>{
    const s=inc.sessions[k];if(!s||s.person!==from)return;
    const copy=JSON.parse(JSON.stringify(s));copy.person=to;
    const id=copy.date?to+'|'+copy.date+'|'+(copy.day||''):String(k).replace(/^[^|]+/,to);
    copy.id=id;sessions[id]=copy;
  });
  Object.keys(inc.daily||{}).forEach(k=>{if(k.indexOf(from+'|')===0)daily[to+'|'+k.slice(from.length+1)]=JSON.parse(JSON.stringify(inc.daily[k]));});
  Object.keys(inc.drafts||{}).forEach(k=>{if(k.indexOf(from+'|')===0)drafts[to+'|'+k.slice(from.length+1)]=JSON.parse(JSON.stringify(inc.drafts[k]));});
  return {sessions,daily,drafts,
    goals:JSON.parse(JSON.stringify(inc.goals[from]||{start:'',goal:''})),
    weighIns:JSON.parse(JSON.stringify(inc.weighIns[from]||[])),
    measures:JSON.parse(JSON.stringify(inc.measures[from]||[]))};
}
function mergePerson(p,data){
  ensurePerson(p);
  Object.keys(data.sessions||{}).forEach(k=>{
    const b=data.sessions[k];if(!b||b.person!==p)return;
    const a=store.sessions[k];
    if(!a||String(b.finishedAt||'')>String(a.finishedAt||''))store.sessions[k]=b;
  });
  const m=new Map();(store.weighIns[p]||[]).forEach(x=>m.set(x.date,x));(data.weighIns||[]).forEach(x=>m.set(x.date,x));store.weighIns[p]=[...m.values()];
  const mm=new Map();(store.measures[p]||[]).forEach(x=>mm.set(x.date,x));(data.measures||[]).forEach(x=>mm.set(x.date,Object.assign({},mm.get(x.date),x)));store.measures[p]=[...mm.values()];
  const g=data.goals||{};
  ['start','goal'].forEach(f=>{if(!store.goals[p][f]&&g[f])store.goals[p][f]=g[f];});
  Object.keys(data.daily||{}).forEach(k=>{if(k.indexOf(p+'|')===0)store.daily[k]=Object.assign({},data.daily[k],store.daily[k]||{});});
  Object.keys(data.drafts||{}).forEach(k=>{if(k.indexOf(p+'|')===0&&!store.drafts[k])store.drafts[k]=data.drafts[k];});
}
async function doExport(){
  const txt=JSON.stringify(exportObj(),null,1),name='gym-backup-'+String(currentPerson()).replace(/\s+/g,'-')+'-'+nowDenver().date+'.json';
  const file=new File([txt],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Gym backup'});store.lastBackup=new Date().toISOString();save();render(true);toast('Backup shared');return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  store.lastBackup=new Date().toISOString();save();render(true);toast('Backup downloaded');
}
function doImport(txt,replace){
  let o;try{o=JSON.parse(txt);}catch(e){toast('That doesn\u2019t look like a backup file');return;}
  if(!o||typeof o!=='object'||(!o.sessions&&!o.weighIns&&!o.daily)){toast('That doesn\u2019t look like a backup file');return;}
  const inc=normalize(o);
  const me=currentPerson();
  ensurePerson(me);
  const incoming=peopleIn(inc);
  let data;
  if(incoming.indexOf(me)>=0){
    data={sessions:{},daily:{},drafts:{},goals:inc.goals[me]||{start:'',goal:''},weighIns:inc.weighIns[me]||[],measures:inc.measures[me]||[]};
    Object.keys(inc.sessions||{}).forEach(k=>{const s=inc.sessions[k];if(s&&s.person===me)data.sessions[k]=s;});
    Object.keys(inc.daily||{}).forEach(k=>{if(k.indexOf(me+'|')===0)data.daily[k]=inc.daily[k];});
    Object.keys(inc.drafts||{}).forEach(k=>{if(k.indexOf(me+'|')===0)data.drafts[k]=inc.drafts[k];});
  }else if(incoming.length===1){
    const from=incoming[0];
    if(!confirm('This backup is for '+from+', not '+me+'. Import it into '+me+' on this phone?'))return;
    data=remapPerson(inc,from,me);
  }else{
    toast(incoming.length?'That backup has more than one other person. Export one profile, or switch to the matching phone profile.':'That backup has no profile data');
    return;
  }
  if(replace){
    if(!confirm('Replace '+me+'\'s data on this phone with this backup? Other people\'s saved data stays on this phone.'))return;
    clearPerson(me);
    if(inc.settings)store.settings=Object.assign(blank().settings,inc.settings);
  }
  mergePerson(me,data);
  save();render(true);
  toast(incoming.indexOf(me)>=0&&incoming.length>1?'Imported '+me+' only':'Backup imported');
}

/* ---------- boot ---------- */
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b){ui.tab=b.dataset.tab;render();}});
window.__app={get store(){return store;},ui,render,act,doImport,exportObj,finish,weekStats,plateHint,SWAP_CAT,SWAP_LIB,getDevice,allPeople,peopleIn};
render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
})();

</script>
